   「動くモブが二重に見える」「残像が残る＝ロールバックがある」の姿と一致する。
   **緩衝を厚くしても直らない**(定数を上げても発振の周期が延びるだけ)。

   直し方は、**送り手の速さを測って、それに同期する**こと(動画配信やネットゲームの
   クライアントがやっている clock recovery)。凍らせない。飛ばさない。速さを目に
   見えない幅で動かして、緩衝の厚みを目標に保つ。
   ============================================================================= */
const lcClamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lcSmooth=(a,b,x)=>{ const t=lcClamp((x-a)/((b-a)||1),0,1); return t*t*(3-2*t); };

const LIVE_CLOCK={
  // --- 底 (もう描けない境界) ------------------------------------------------
  // store.js の entityInterpAt は tt>=maxTick で補間を止める(先へ外挿しない)。
  // だから整数 T.tick は maxTick-1 まで。0.25tick(12.5ms)は「1 フレーム長引いても
  // maxTick へ乗り上げない」ための余白。
  LAG_MIN:0.25,
  // ここから LAG_MIN へ向けて速度を線形に 0 へ落とす。**急停止ではなく滑走停止** ——
  // 幅を 1 tick(= 届く粒 1 つぶん)にすると τ≈50ms の指数接近になり、境界で段差が出ない。
  BRAKE_HI:1.25,
  // --- 目標の遅れ ------------------------------------------------------------
  // 1(補間に t+1 が要る) + 1(届く粒。jar の flush / 配信 / 取り込みが全部 50ms=1tick)
  // + 1(rAF 60Hz と取り込み 20Hz の位相差)。これ以上は下げられない。
  TARGET_MIN:3,
  TARGET_MAX:24,   // 1.2 秒。監視カメラがこれ以上「今」を偽るなら、原因は上流にある
  TARGET_BUMP:2,   // 底に触れたら 1 粒ぶん厚くする(jitter buffer の常法)
  TAU_GROW:3.5, TAU_SHRINK:50,   // 厚くするのは速く、薄くするのは遅く(約14倍)。
                   // 厚くし遅れると画が止まる(見える)。薄くし遅れると遅延が残る(見えない)。
  // --- 制御則 ----------------------------------------------------------------
  // KP: 遅れ 1tick あたり 2%。±10% の頭打ちは e=±5tick。閉ループは1次で
  // τ=1/(R·KP)=2.5s —— 到着の揺れ(<0.2s)より 10 倍遅いので、構造的に揺れを
  // 追いかけられない。1次なので行き過ぎ(オーバーシュート)も原理的に無い。
  KP:0.02,
  // KI: R·KP²/4。R=20 で ζ=1.0(臨界制動)になる値。3tick の定常誤差で 0.6%/秒 ——
  // これは制御ではなく「ずれ取り」。推定器の非対称 EMA が持つ約 5% の偏りを消すのが仕事。
  KI:0.002,
  E_INT:3,         // 積分へ入れる誤差の頭打ち(ワインドアップ防止)
  BIAS_MIN:0.85, BIAS_MAX:1.15,
  // 追従中の速度補正 ±10%。**連続した音が無い**(playSounds は単発サンプル)ので、
  // 音程による ±2〜5% の厳しい閾値は効かない。50ms の tick に対し 5ms のずれで、
  // 動きの不整を感じ取る閾値(≈40ms)より一桁小さい。
  TRIM:0.10,
  TRIM_CATCHUP:1.00,  // 追いつきは最大 2.0 倍。**これは目に見える** —— 見えてよい。
                      // DVR の早送りと同じで、バッジに「追いつき中」と出す。
  RAMP_HI:40,      // 2 秒。ここで上限が 2.0 倍に達する。始まりは L*+5 (KP の線形域の
                   // 外側)なので、追従中の上限は必ず 10% のまま。smoothstep で段差ゼロ。
  SNAP_AT:200,     // 10 秒。2.0 倍で追いつくと 10 秒かかる —— それは見たい絵ではない。飛ぶ。
  // --- 測定 ------------------------------------------------------------------
  // 窓 500ms: σ(R)≈√2·σ到着·R/T = 1.41·0.03·20/0.5 ≈ 1.7tick/s (8.5%)。
  // これより短いと雑音が絵の速さに出る。長いと TPS の段差に追従できない。
  RATE_WIN_MS:500,
  // ただし**窓の中の tick が少ないと、量子化誤差がそのまま偏りになる。**
  // 実測(live-clock-selftest, 5TPS): 500ms 窓には 2〜3 tick しか入らず、
  // 「下げは速く上げは遅く」の非対称 EMA が下側の 4t/s を掴んで離さない →
  // 推定 4.3(-14%)、遅れが 14tick まで開いた。窓に最低 8 tick 入るまで
  // (最大 2.5 秒まで)伸ばすと、量子化誤差は相対的に 1/3 以下になる。
  RATE_MIN_TICKS:8, RATE_WIN_MAX_MS:2500,
  // **下げは速く、上げは遅く。** 遅すぎるのは無害(遅れが増え、KP が押し戻す)。
  // 速すぎるのが底に当たる方。代償の約 5% の低い偏りは KI が消す。
  TAU_RATE_DOWN:0.25, TAU_RATE_UP:1.0,
  STALL_MS:300,    // 6 tick ぶん。超えたら測定を止めて R̂ を**保持する**
                   // (0 へ落とすと、再開時に立ち上がりへ数秒かかる)
  RING:192,   // 60fps で 3.2 秒ぶん。上の RATE_WIN_MAX_MS(2.5秒)が窓を伸ばしきれる長さが要る
  s:null,
};
LIVE_CLOCK.reset=function(){
  const C=LIVE_CLOCK;
  C.s={ t:new Float64Array(C.RING), m:new Float64Array(C.RING), i:0, n:0,
        rate:20, warm:false, rateAt:0, lastMax:-1, lastAdvAt:0, stalledMs:0,
        lag:C.TARGET_MIN, lagRaw:C.TARGET_MIN, target:C.TARGET_MIN+1,
        jit:0, burst:1, bias:1, trim:1, brake:1, onFloor:false,
        floorTouches:0, snaps:0, reconnects:0, drops:0, beatAt:0,
        frames:0, stoppedFrames:0 };
};
LIVE_CLOCK.reset();
/** 直ったかどうかの数字。**静止フレームの割合が唯一の指標**(§検証)。 */
LIVE_CLOCK.report=function(){
  const s=LIVE_CLOCK.s;
  return { stoppedPct: s.frames?100*s.stoppedFrames/s.frames:0, frames:s.frames,
           rate:s.rate, target:s.target, lag:s.lagRaw, trim:s.trim, brake:s.brake,
           floorTouches:s.floorTouches, snaps:s.snaps, reconnects:s.reconnects, drops:s.drops };
};

/** maxTick の伸びから送り手の速さを測る。**止まっている間は測らない**(保持する)。 */
function liveClockSample(now){
  const C=LIVE_CLOCK, s=C.s, m=D.maxTick;
  // 裏タブから戻った直後など、窓が「空白の時間」をまたいでいると傾きが無意味になる。捨てる。
  if(s.n&&now-s.t[(s.i-1+C.RING)%C.RING]>250){ s.n=0; s.i=0; }
  if(m>s.lastMax){ s.lastMax=m; s.lastAdvAt=now; }
  if(!s.lastAdvAt) s.lastAdvAt=now;
  s.stalledMs=now-s.lastAdvAt;
  if(s.stalledMs>C.STALL_MS) return;          // 止まっている間は測らず、R̂ を保持する
  s.t[s.i]=now; s.m[s.i]=m; s.i=(s.i+1)%C.RING; if(s.n<C.RING) s.n++;
  // 窓の左端を探す: 500ms 以上前で、かつ **その間に 8 tick 以上進んでいる**最初の点。
  // 遅い水槽ほど窓が自動的に伸びる(上限 2.5 秒)。伸ばしきっても足りなければ、
  // その時点で一番古い点を使う —— 測らないよりは粗くても測るほうがよい。
  let k=-1;
  for(let j=1;j<s.n;j++){
    const idx=(s.i-1-j+C.RING*2)%C.RING, age=now-s.t[idx];
    if(age<C.RATE_WIN_MS) continue;
    k=idx;
    if(m-s.m[idx]>=C.RATE_MIN_TICKS||age>=C.RATE_WIN_MAX_MS) break;
  }
  if(k<0) return;                              // まだ窓が埋まっていない(起動直後は R̂=20 のまま)
  const dtS=(now-s.t[k])/1000; if(dtS<=0) return;
  const r=(m-s.m[k])/dtS;
  const tau=r<s.rate?C.TAU_RATE_DOWN:C.TAU_RATE_UP;
  const dt=Math.min(0.25,(now-(s.rateAt||now))/1000); s.rateAt=now;
  s.rate+=(r-s.rate)*(1-Math.exp(-dt/tau));
  s.rate=lcClamp(s.rate,0.5,60); s.warm=true;
}

/** 底のブレーキ。**生の遅れで測る** —— 均した値では境界に間に合わない。 */
function liveBrake(lagRaw){
  const C=LIVE_CLOCK;
  return lcClamp((lagRaw-C.LAG_MIN)/(C.BRAKE_HI-C.LAG_MIN),0,1);
}

/** 目標の遅れを動かす。**底に触れたら厚くする** —— これが自己調整の本体。 */
function liveClockRetarget(dt){
  const C=LIVE_CLOCK, s=C.s;
  if(s.brake<1&&!s.onFloor){ s.onFloor=true; s.floorTouches++;
    s.target=Math.min(C.TARGET_MAX,s.target+C.TARGET_BUMP); }
  else if(s.brake>=1&&s.lagRaw>C.BRAKE_HI+0.5) s.onFloor=false;   // 0.5tick のヒステリシス
  const dev=Math.max(0,s.lag-s.lagRaw);        // **下振れだけ**見る。危ないのはそちら
  s.jit+=(dev-s.jit)/64;                       // RFC 3550 と同じ形。τ≈3.2s
  const want=lcClamp(1+s.burst+1.5*s.jit+1,C.TARGET_MIN,C.TARGET_MAX);
  const tau=want>s.target?C.TAU_GROW:C.TAU_SHRINK;
  s.target+=(want-s.target)*(1-Math.exp(-dt/tau));
  s.target=lcClamp(s.target,C.TARGET_MIN,C.TARGET_MAX);
}

/** このフレームで進めてよい速さ [tick/秒]。**時計の唯一の持ち主。** */
function liveClockStep(now,dt){
  const C=LIVE_CLOCK, s=C.s;
  liveClockSample(now);
  s.lagRaw=D.maxTick-(T.tick+T.partial);
  // **10 秒以上遅れたら追いつかずに飛ぶ。** 監視カメラなので今を映すのが正しい。
  // ただし**黙って飛ばない** —— 黙る跳躍は、直したばかりの巻き戻りと同じ種類の嘘。
  if(s.lagRaw>C.SNAP_AT){
    const skipped=s.lagRaw-s.target;
    T.tick=Math.max(D.minTick||0,Math.round(D.maxTick-s.target)); T.acc=0; T.partial=0;
    s.bias=1; s.lag=s.target; s.lagRaw=s.target; s.snaps++;
    s.burst=1;   // 一括で届いた分を「毎回これだけ届く」と誤解しない(下の BURST_MAX 参照)
    // gl.js の ysm は**巻き戻すと tick 0 から積分し直す**。前進は差分だけで済む。
    // だから飛んだときに ysm の状態をリセットしてはいけない —— 前進が安い方。
    if(typeof tankSay==='function') tankSay('最新へ飛んだ（'+(skipped/20).toFixed(1)+' 秒ぶんを飛ばした）');
    return 0;
  }
  // 制御は**均した遅れ**で行う。生の遅れは 50ms ごとに 0/1/2 と跳ねるので、
  // そのまま速度へ通すと 20Hz の速度揺れ = 新しいカクつきになる。
  s.lag+=(s.lagRaw-s.lag)*(1-Math.exp(-dt/0.20));
  liveClockRetarget(dt);
  const e=s.lag-s.target;
  const capHi=C.TRIM+(C.TRIM_CATCHUP-C.TRIM)*lcSmooth(s.target+5,C.RAMP_HI,s.lag);
  if(s.stalledMs<=C.STALL_MS) s.bias+=C.KI*lcClamp(e,-C.E_INT,C.E_INT)*dt;
  s.bias=lcClamp(s.bias,C.BIAS_MIN,C.BIAS_MAX);
  s.trim=lcClamp(1+C.KP*e+(s.bias-1),1-C.TRIM,1+capHi);
  s.brake=liveBrake(s.lagRaw);
  return s.rate*s.trim*s.brake;
}

function loop(now){
  // **ライブは「再生ボタンを押す」ものではない。** 配信に繋いだ時点で追従は始まって
  // いる(openLive() が T.playing を立てる)。ただし T.playing 自体は尊重する ——
  // 監視カメラを「今ここで止めて見る」のは正当な操作で、「最新を映す」で追い直せる。
  const live=liveOpen();
  if(T.playing&&D.nTicks){
    const dt=Math.min(250,now-T.last)/1000; T.last=now;   // 250ms 上限は据え置き(裏タブ復帰の暴走止め)
    let rate;
    if(live&&T.followLive){
      rate=liveClockStep(now,dt);                          // 送り手に同期する
    }else{
      // 記録、またはライブで過去を見ている人。名目 20tick/秒 × ユーザ速度。
      // 底のブレーキだけは共有する —— データの先へは誰も出られない。
      const lagRaw=D.maxTick-(T.tick+T.partial);
      rate=20*T.speed*(live?liveBrake(lagRaw):1);
      LIVE_CLOCK.s.lagRaw=lagRaw;
      if(live&&lagRaw<LIVE_CLOCK.s.target) T.followLive=true;   // 追いついたら追従へ戻す
    }
    T.acc+=rate*dt;
    // 音は「普通の速さで進んだ tick」でだけ鳴らす —— 追いつき中や飛んだ直後に
    // 単発音が数十個同時に鳴るのを防ぐ。
    let steps=0; const audible=rate<=30;
    while(T.acc>=1&&steps<64){ T.acc-=1; T.tick++; steps++; if(audible&&steps<=4) playSounds(T.tick); }
    if(T.acc>=1) T.acc=0;
    // **最後の砦。** 上の rate が既に 0 へ落としているので普通は発火しない。
    // 発火したら底に触れたのと同じ意味なので、数に入れる(黙って凍らない)。
    const cap=live?Math.max(0,D.maxTick-1):D.maxTick;
    if(T.tick>=cap){
      if(T.tick>cap){ T.tick=cap; T.acc=Math.min(T.acc,0.999);
        if(live&&!LIVE_CLOCK.s.onFloor){ LIVE_CLOCK.s.onFloor=true; LIVE_CLOCK.s.floorTouches++; } }
      if(!live&&T.tick>=D.maxTick){ T.tick=D.maxTick; T.acc=0; T.playing=false; syncPlayBtn(); }
    }
    // T.partial: 次tickまでの割合(0以上1未満)。末尾では 0 —— 外挿しない(13-01 決定1③)。
    T.partial=(T.tick<D.maxTick)?lcClamp(T.acc,0,0.999):0;
    // **「止まったフレーム」を数える。** これが直ったかどうかの唯一の数字。
    // 平均 fps では原理的にこの区別ができない(60fps のまま画が止まるのが本件)。
    LIVE_CLOCK.s.frames++; if(rate<1) LIVE_CLOCK.s.stoppedFrames++;
    // _inLoop: この draw() が「連続表示の1フレーム」であることの印。
    // pointermove からの再描画と区別するために立てる (fps の分子はこれだけ)。
    T._inLoop=true; draw(); T._inLoop=false;
  } else { T.last=now; T.partial=0; }
  perfTick(now);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* =============================================================================
   7.5 霊夢をスポーンさせる（シナリオを走らせて、できた結果をそのまま開く）
   ============================================================================= */

/**
 * シナリオ選択と「スポーン」ボタンを組み立てる。
 *
 * <p>押すとサーバが `gradlew runSim` を起動し、**新しいトレースが出来たら**そのパスを返す。
 * こちらはそれを自動で開く —— にーくらはトレースファイルの存在を意識しない。
 *
 * <p>約45秒かかる（実測）。走っている間の様子は見えない（それは Phase 12 の仕事）。
 */
// ===== 水槽（ライブ）==========================================================
// にーくら 2026-08-20:『巨大な研究所の、監視カメラで監視されてる大きな水槽』
//   カメラ = /api/live を受けて描くだけ。中を変えない。
//   手     = 起動 / 停止 / 放つ。**押されたときだけ**中に届く。
// この2つを混ぜないこと（見ているだけのときは中が変わらないと保証できる状態にしておく）。
// 13-03: liveLines(受けた行を全部溜め続ける生の行の配列)を撤去した。全履歴を持つのは
// D.store(疎ストア)1つだけにする(D-03は守るが、その担い手は生の行ではない)——
// livePending は「まだ store/series へ取り込んでいない」分だけを一時的に積む入れ物で、
// 毎秒 appendLive() が消費して空にする(下の openLive 参照)。
// liveGenRun: D.gen をライブの run 入れ替わりでも進めるための直前 run 識別子
// (openLive 冒頭の説明を参照)。
let liveSrc=null, livePending=[], liveTimer=null, liveDirty=false, liveGenRun=undefined;
// 取り込み済みのバイト位置と、それがどの記録のものか (= 最後に受けた行の id を分解したもの)。
// 二重取り込みの判定はこの 2 つだけで行う —— tick は使わない (appendLive の説明を参照)。
// liveSeenRun: liveSeen がどの run のものか。**繋ぎ直しで記録を捨てるかどうかの判断**に
// 使う。SSE の id から採る liveSeenKey はサーバ側の正規化が入るので、行が 1 つも来る前
// (= まさに繋ぎ直しの瞬間)には比べられない。LIVE_RUN ならその時点で判る。
let liveSeen=0, liveSeenKey=null, liveSeenRun=null;

function tankSay(m){ const el=document.getElementById('tankMsg'); if(el) el.textContent=m; }

/** テキスト/色/波形(#tankPulse)が共有する3分類。判定を2箇所に書かない。 */
function tankBeatKind(hb,state){
  if(state==='idle'||state==='stopped'||state==='done'||!state) return 'idle';
  if(state==='error') return 'dead';
  if(hb&&hb.alive) return 'alive';
  if(state==='running') return 'idle';
  return 'dead';   // live/stale のはずが心拍が来ない —— 立てたのに死んだ
}

/**
 * 心拍を映す。**中身とは別に『生きている』を出す。**
 * 空の水槽では「誰もいない」と「壊れている」が同じ絵になるので、これが要る。
 */
function tankBeat(hb,state){
  const el=document.getElementById('tankBeat');

  /* **状態が心拍より偉い。** 心拍はファイルに書かれた「最後に見た値」なので、
     プロセスが死んだ後も 10 秒ほど alive:true のまま残る。先に心拍を見ると、
     その隙間で**死んだ水槽を緑で「生きている」と表示する** —— 監視カメラの
     最悪の壊れ方(止まった画像を映し続ける)そのもの。2026-08-21 に実機で発生:
     state:"error"(exit 1) なのにパネルは「● tick 1860 — 生きている」だった。 */
  const kind=tankBeatKind(hb,state);
  tankPulsePush(hb,kind);   // 波形は心拍が届くたびに1点足す(テキストと同じ判定を見る)
  if(!el) return;

  if(state==='idle'||state==='stopped'||state==='done'||!state){
    // 一度も立てていない/明示的にたたんだ/走り切った —— 何も壊れていない。
    el.textContent='● 未起動';
    el.style.color='#8a8f99';
    return;
  }
  if(state==='error'){
    el.textContent='● 落ちた';
    el.style.color='#d08a8a';
    return;
  }
  // ここから先(live / stale / running)は「水槽が在るはず」の状態。心拍を信じてよい。
  if(kind==='alive'){
    el.textContent='● tick '+hb.tick+' — 生きている';
    el.style.color='#8ac08a';
    return;
  }
  if(state==='running'){
    el.textContent='● 立ち上げ中';
    el.style.color='#8a8f99';
    return;
  }
  // live/stale のはずが心拍が来ない —— 立てたのに死んだ。赤の意味はここに取っておく。
  el.textContent='● 心拍なし';
  el.style.color='#d08a8a';
}

/* ---- 心拍の波形 (#tankPulse) ----
   にーくらの比喩どおり「監視カメラの水槽」の心電図。テキストより先に目が行く、
   このパネルで唯一の主張の強い要素にする(それ以外は静かに保つ)。
   直近48サンプルの tick 差分を高さへ写す。生きていれば揺れ、死ねば揺れない。 */
const TANK_PULSE_MAX=48;
const TANK_PULSE_NORMAL=20, TANK_PULSE_CLAMP=40;   // 心拍はおよそ毎秒=20tick。上下 clamp はその2倍
let TANK_PULSE=[];   // { tick:number|null, kind:'alive'|'idle'|'dead' }[] 直近48件

function tankPulsePush(hb,kind){
  TANK_PULSE.push({ tick:(hb&&typeof hb.tick==='number')?hb.tick:null, kind });
  if(TANK_PULSE.length>TANK_PULSE_MAX) TANK_PULSE.shift();
  tankPulseDraw();
}

function tankPulseDraw(){
  const cv=document.getElementById('tankPulse');
  if(!cv) return;
  const ctx=cv.getContext('2d'), W=cv.width, H=cv.height;
  ctx.clearRect(0,0,W,H);

  if(!TANK_PULSE.length){
    // 心拍が一度も届いていない —— 空白のまま残さない。壊れて見えるのを防ぐ細い水平線。
    ctx.strokeStyle=CSS('--line'); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(0,H/2+0.5); ctx.lineTo(W,H/2+0.5); ctx.stroke();
    return;
  }

  const kind=TANK_PULSE[TANK_PULSE.length-1].kind;
  ctx.strokeStyle = kind==='alive' ? CSS('--axis-y') : (kind==='dead' ? '#d08a8a' : CSS('--ink-faint'));
  ctx.lineWidth=1.3;

  // delta=0 は下端寄り、delta=NORMAL(20)は中央、delta>=CLAMP(40)は上端寄りへ写す。
  // margin=H/6 を残すことで「通常運転が中央2/3に収まる」を満たす。
  const margin=H/6;
  const yFor=(delta)=>{
    const c=Math.max(0,Math.min(TANK_PULSE_CLAMP,delta));
    return (H-margin)-(c/TANK_PULSE_CLAMP)*(H-margin*2);
  };
  const n=TANK_PULSE.length, stepX=n>1?W/(n-1):0;
  ctx.beginPath();
  let prevTick=null;
  for(let i=0;i<n;i++){
    const s=TANK_PULSE[i];
    // 直前サンプルの tick が無ければ差分を測れない —— 通常値で埋め、開始点が
    // 不自然に沈まないようにする(意味の無い値を作らない: あくまで「測れない」扱い)。
    const delta=(prevTick!=null&&s.tick!=null)?(s.tick-prevTick):TANK_PULSE_NORMAL;
    if(s.tick!=null) prevTick=s.tick;
    const x=n>1?i*stepX:W/2, y=yFor(delta);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();
}

/* ---- ボタン1つの水槽パネル (§7-1) ----
   にーくら『写真の起動と停止、なんの役に立つかすらわからないんだ』。
   ボタンは常に1つ。/api/run/status が言える状態(idle/running/live/stale/error/done/stopped)
   ぜんぶを、押す前から結果が判る一行の文と色に落とす。 */

/** 状態名 → {label,hint,kind,disabled,act} の純粋な対応表。実データ(経過秒/エラー文)は持たない。 */
function tankActionFor(state){
  const START_HINT='押すと Minecraft が起動し、誰もいない世界が1〜2分で立つ。';
  switch(state){
    case 'running':
      return {label:'起動中…',hint:'起動している。誰もいない世界が立つまで残り1〜2分。',
        kind:'idle',disabled:true,act:null};
    case 'live':
      return {label:'水槽をたたむ',hint:'押すと Minecraft が終了し、中のモブと記録中のトレースも一緒に終わる。',
        kind:'danger',disabled:false,act:'stop'};
    case 'stale':
      return {label:'再接続',hint:'心拍が途絶えた —— 表示は生きていても水槽は壊れているかもしれない。'+START_HINT,
        kind:'primary',disabled:false,act:'start'};
    case 'error':
      return {label:'再起動',hint:'前回は失敗して止まった。'+START_HINT,
        kind:'primary',disabled:false,act:'start'};
    case 'done':
      return {label:'水槽を立てる',hint:'前回の記録は終わっている。'+START_HINT,
        kind:'primary',disabled:false,act:'start'};
    case 'idle': case 'stopped': default:
      return {label:'水槽を立てる',hint:START_HINT,kind:'primary',disabled:false,act:'start'};
  }
}

const TANK_ACT_HANDLERS={start:null,stop:null};   // buildTankUi() が中身を差し込む
let TANK_START_IN_FLIGHT=false;   // 起動ポーリング中は5s見張りポーリングと取り合わない
let TANK_LAST_STATE=null;
let TANK_LIVE_GUARD_UNTIL=0;      // live 直後この時刻まで #tankAct を強制無効化(T-1a4-02)
let TANK_GUARD_TIMER=null;

/** status(またはstate名の断片)をDOMへ描く。押下・ポーリング・再接続、全部がここを通る。 */
function tankRenderAction(status){
  const btn=document.getElementById('tankAct'), hintEl=document.getElementById('tankHint');
  if(!btn||!hintEl) return;
  const state=(status&&status.state)||'idle';
  const r=tankActionFor(state);

  // live に入った瞬間だけガードを張り直す。1200ms 経ったら自分で描き直して外す
  // (起動連打の最後の1発が、立ち上がった直後の停止に化けて1〜2分をふいにする事故を防ぐ)。
  const enteringLive=state==='live'&&TANK_LAST_STATE!=='live';
  TANK_LAST_STATE=state;
  if(enteringLive){
    TANK_LIVE_GUARD_UNTIL=Date.now()+1200;
    clearTimeout(TANK_GUARD_TIMER);
    TANK_GUARD_TIMER=setTimeout(()=>tankRenderAction(status),1220);
  }
  const guarded=state==='live'&&Date.now()<TANK_LIVE_GUARD_UNTIL;

  let hint=r.hint;
  // **理由はメッセージ行に置く。ヒントに足さない。**
  // ヒントは「押すと何が起きるか」だけを言う欄で、サーバの理由文はそれ自体が括弧を
  // 含むため、足すと「…立つ。（gradlew が exit 1 で終了した（…を見る））」という
  // 入れ子になって読めなくなっていた(2026-08-21 実機で確認)。しかも同じ文字列を
  // tankSay() が既に出しており、二重だった。
  if((state==='stale'||state==='error')&&status&&status.error) tankSay('× '+status.error);
  if(state==='running'&&status&&status.started){
    const sec=Math.max(0,Math.round((Date.now()-status.started)/1000));
    hint=r.hint+' 経過 '+sec+'s。';
  }

  btn.textContent=r.label;
  btn.className=r.kind==='primary'?'primary':(r.kind==='danger'?'danger':'');
  btn.disabled=!!r.disabled||guarded;
  btn.onclick=r.act?TANK_ACT_HANDLERS[r.act]:null;
  hintEl.textContent=hint;

  // 「放つ」(§4): live のときだけ触れる。それ以外は見えるが休眠 —— 出たり消えたり
  // すると棚が跳ねて何ができる道具かが隠れる(design point 4)。#tankSpawn.dormant が
  // 透明度と pointer-events をまとめて切る(CSS側、TANK_CSS参照)。
  const spawn=document.getElementById('tankSpawn');
  if(spawn) spawn.classList.toggle('dormant',state!=='live');
  const summonBtn=document.getElementById('tankSummon');
  if(summonBtn) summonBtn.disabled=state!=='live';
}

/** ライブセッションの新規開始(またはrun入れ替わり)の下ごしらえ。D.store/
 *  D.seriesStateを空で作り直し、D.key/D.pathとtraceName表示を揃える——
 *  実際の初期表示(空の水槽)はこの直後に openLive() が appendLive([]) を
 *  呼んで仕上げる。load()はもう呼ばない(13-03、CYCLE-05)。 */
function resetLiveState(){
  D.store=SimStore.create();
  D.minTick=0;
  D.seriesState=SHARED?SHARED.seriesState():null;
  D.path='水槽（ライブ）';
  /* **表示名と実パスを分ける。**
   *
   * D.path はこの通り表示名で、traceName にそのまま出る。ところが gl.js の setTrace は
   * これを companion の解決 (loadPoseTrace / loadPalette) へも渡していたので、
   * ライブでは /api/pose も /api/palette も「水槽（ライブ）」というパスを引きに行き、
   * **必ず 404 になっていた** —— palette がライブで一度も起動しない原因
   * (2026-08-25 の審査で判明)。実パスは LIVE_RUN が持っている
   * (status.trace そのもの = <scenario>/<date>/<runId>/arena-0.jsonl)。
   *
   * D.key は触らない —— 13-02 がライブ中に安定させたもので、変えると setTrace の
   * 早期 return が効かなくなり GPU へ丸ごと再アップロードになる。 */
  D.tracePath=LIVE_RUN;
  D.key=D.path+'#'+D.gen;
  document.getElementById('traceName').textContent=D.path;
}

/** 配信を開く。**全履歴は D.store(疎ストア)1つが持つ**(D-03)——受けた行は
 *  livePending へ「まだ取り込んでいない分」だけ積み、毎秒 appendLive() が
 *  store/series へ渡して空にする。生の行を溜め続けることはもうしない(13-03)。 */
function openLive(run){
  const target=(run!==undefined?run:LIVE_RUN);
  /* **同じ記録の繋ぎ直しでは、覚えているものを捨てない。**
   *
   * 旧実装はここで無条件に resetLiveState() を呼び、D.store を空にしていた。
   * T.tick に小さい数を代入している行は 1 つも無いのに、描画時刻は D.frameAt と
   * SimStore.frameAt の**2 段の clamp** で「その時の D.maxTick」へ丸められる。
   * だから store を捨てた瞬間、**絵だけが tick 0 付近まで戻り**、データが流れ込む
   * につれて早送りで追いつく —— にーくら 2026-08-23「ロールバックがある」の正体。
   * tankSyncLive の 5 秒見張りは SSE が切れるたびここを呼ぶので、
   * **接続が切れた回数だけ巻き戻っていた。**
   *
   * 判定に LIVE_RUN を使う理由: SSE の id から採る liveSeenKey はサーバ側で
   * 正規化されており、行が 1 つも来ていない繋ぎ直しの瞬間には比べようがない。 */
  // 繋ぎ直し (resume) では resetLiveState を通らないので、ここでも実パスを合わせる。
  // 同じ run なら値は変わらないが、run が入れ替わった直後にここだけ古いままだと
  // 前の水槽の companion を引き続ける。
  if(target) D.tracePath=target;
  const resume=(liveSeen>0&&liveSeenRun!==null&&liveSeenRun===target);
  closeLive();
  livePending=[]; liveDirty=false;
  if(resume){
    LIVE_CLOCK.s.reconnects++;
    // D.gen は**進めない**。進めると D.key が変わり、gl.js の setTrace の早期 return が
    // 効かなくなって GPU へ丸ごと再アップロードになる。
  }else{
    liveSeen=0; liveSeenKey=null; liveSeenRun=target;
    LIVE_CLOCK.reset();
    T.tick=0; T.acc=0; T.partial=0;
    TANK_FRAMED=false;
  }
  T.followLive=true;
  // 素の EventSource は Last-Event-ID を送らない(ブラウザ自身の自動再接続のときだけ)。
  // だから**こちらから開き直すときは ?from= を自分で渡す**。
  liveSrc=new EventSource('/api/live'+(resume?('?from='+liveSeen):''));
  // 行と一緒に **id ("<どの記録か>:<バイト位置>")** を持つ。二重取り込みの判定は
  // これで行う —— tick で判定していた頃は、同じ tick の行がバッチ境界をまたいだ
  // だけで後半が捨てられていた (下の appendLive の説明を参照)。
  liveSrc.onmessage=(e)=>{ livePending.push({d:e.data,id:String(e.lastEventId||'')}); liveDirty=true; };
  liveSrc.addEventListener('beat',(e)=>{ LIVE_CLOCK.s.beatAt=performance.now();
    try{ tankBeat(JSON.parse(e.data),'live'); }catch{ /* 壊れた心拍は次で拾う */ } });
  liveSrc.onerror=()=>{ LIVE_CLOCK.s.drops++;
    tankSay('配信が切れた（続きから繋ぎ直します —— 覚えているものは捨てません）'); };
  LIVE_CLOCK.s.beatAt=performance.now();
  if(!resume){
    // 13-03: 別のrun(表示名は同じ '水槽（ライブ）' のまま中身のrunだけ変わる)へ
    // 入れ替わったときは D.gen を進める。旧来の同世代判定は、常に同じ文字列である
    // name を D.path と比べるだけなので、ライブのrun入れ替わりを見分けられない
    // (13-02-SUMMARY.md記載の既知の穴)。tankSyncLive が openLive() を呼ぶ直前に
    // 更新している LIVE_RUN をここで直接比較し、世代を進める。
    if(LIVE_RUN!==liveGenRun){ D.gen=(D.gen||0)+1; liveGenRun=LIVE_RUN; }
    // D.store/D.seriesStateを作り直す(全文ローダはもう呼ばない——CYCLE-05のため
    // ライブ経路は全面的にappendLiveへ寄せる。resetLiveStateのdocstring参照)。
    // **新しい記録のときだけ。ここが唯一の呼び出し元。**
    resetLiveState();
  }
  // **即座に切り替える。** 最初の SSE 行を待たない —— 空の水槽は「読み込み中」ではなく
  // 行き先そのもの (design point 2)。appendLive([]) は0行の追記として空の状態を
  // 確定させ、draw() のチャンバーを即座に出す。カメラは動かさない (誰か現れたときだけ
  // 寄せる、下の interval の「初回誰か現れた」判定へ委ねる)。
  appendLive([],{});
  // **繋いだ時点で追い始める。** ライブは開いたら既に動いているもので、
  // 見るために再生ボタンを押させるのは録画の作法(にーくら 2026-08-22)。
  T.playing=true; T.last=performance.now(); T.acc=0;
  syncPlayBtn();
  tankLiveBadge(); tankWho();
  // **溜めてから取り込む。ただし溜めすぎない。**
  //
  // 1 行ごとの取り込みは重いだけで意味が無い —— が、1 秒ぶん溜めるのは粗すぎた。
  // 実測(2026-08-22、にーくら「fps は 60 あるのに 10fps に見える」):
  //   tick の変化が 4 秒間に 6 回。1 秒に 1 度 +25tick まとめてワープしていた。
  //   fps は 151 出ているのに、画面の中身は 1 秒に 1 回しか変わらない
  //   = 1fps の紙芝居を 151fps で表示している状態だった。
  //
  // データは serve.mjs の pump が 250ms ごとに送っている。取り込みをそれより細かく
  // 刻んでも新しい行は来ないので、**125ms** にして「届いたら次の刻みで必ず載る」ようにする。
  // 費用は測ってある: 200 行で 11ms、125ms 刻みなら 1 回あたり 40 行前後で数 ms。
  // 60fps(16.7ms/フレーム)を割る心配のない範囲。
  const LIVE_INGEST_MS=50;
  let first=true;
  liveTimer=setInterval(()=>{
    if(!liveDirty||!livePending.length) return;
    liveDirty=false;
    const lines=livePending; livePending=[];
    // live:true —— 最新を追う。初回だけカメラを寄せる（毎秒寄せると視点を奪う）。
    // **カメラを寄せるのは「最初に誰かが現れた時」。**
    // 初回 load の時点では空の水槽なので、寄せる先が無く豆粒のままだった。
    const someone=D.entities.size>0;
    const frame=!TANK_FRAMED&&someone;
    appendLive(lines,{frameCam:frame||first});
    if(frame){
      TANK_FRAMED=true;
      // **距離も寄せる。** frameCam は注視点だけ動かして cam.dist を変えないので、
      // 水槽の広さ (半径24) に合わせた初期値のままだと霊夢が豆粒だった (撮って確認)。
      cam.dist=15; draw();
    }
    first=false;
    tankLiveBadge(); tankWho();
  },LIVE_INGEST_MS);
}

function closeLive(){
  if(liveSrc){ liveSrc.close(); liveSrc=null; }
  if(liveTimer){ clearInterval(liveTimer); liveTimer=null; }
  if(typeof tankLiveBadge==='function') tankLiveBadge();
  // 配信が切れたらここは録画の世界に戻る。ボタンの題も戻す
  // (liveOpen() が false になってから呼ぶこと —— 上で liveSrc を null にした後)。
  if(typeof syncPlayBtn==='function') syncPlayBtn();
}

/**
 * ライブの毎秒処理の本体(13-03、CYCLE-05)。**新着行だけ**を D.store と
 * D.seriesState へ追記する——旧来の全文ローダはもう呼ばない(旧来の全文ローダは
 * 毎回 D.store を作り直し、text 全文を SHARED.parseTrace に通していた。履歴が伸びる
 * ほど毎秒の費用も伸びていたのが直すべき本体だった。PHASE13-INPUT 実測: 41.9MB で
 * 毎秒 4,173ms)。
 *
 * lines は「まだ store/series へ取り込んでいない」1秒ぶんの行配列。SimStore.append は
 * 配列をそのまま受けるので、結合してから渡し直さない(store.js 内で自前に分割する
 * だけなので、結合してから渡すと分割し直す分だけ無駄になる)。SHARED.parseTrace は
 * 文字列前提なのでそちらだけ結合するが、対象は新着ぶんだけ——履歴丸ごとの結合
 * (旧実装、42MBで26ms)はもう発生しない。
 */
function appendLive(lines,opts){
  opts=opts||{};
  // **取り込みの実費を測って残す。** 13-03 の計測は「新着 60 行」で行ったが、
  // 実際の戦闘中は 300〜380 行/秒 出る(2026-08-22 実測)。5〜6 倍の負荷を一度も
  // 測っていなかったので、体感との食い違いを説明できなかった。右下に出して、
  // 「重い」と感じた瞬間の数字がその場で読めるようにする。
  const _ingest0=performance.now();
  /* **二重取り込みの判定は「行の位置」で行う。tick で行ってはいけない。**
   *
   * 旧実装は「t が store.maxTick 以下の行を捨てる」だった(T-13-09)。当時は取り込みが
   * 1 秒バッチだったので「1 つの tick の行がバッチ境界をまたぐのは極めて起きにくい」
   * と書いてあったが、**その前提はもう成り立たない** —— 2026-08-22 に jar の flush /
   * 配信 / 取り込みを 3 段とも 50ms(=1 tick)へ揃えたので、バッチ境界と tick 境界は
   * 同じ細かさになった。同じ tick の行が 2 つのバッチに分かれるのは日常で、
   * **後から届いた半分は黙って捨てられていた**。
   *
   * SimArena は 1 tick の中で「全員の pos」→「消えた者の gone」の順に書く。
   * つまり境界に当たったとき落ちやすいのは gone のほう ——
   * にーくら 2026-08-23「クリーパーが死んでも描画される」の姿と一致する。
   *
   * 今は serve.mjs が各行に id (= その行の末尾のバイト位置) を付けて送るので、
   * 「もう取り込んだ位置」より後ろかどうかで正確に判定できる。tick を見る必要が無い。
   * 再接続はサーバ側が Last-Event-ID で続きから送るので、そもそも再送自体が来ない。 */
  /* **記録が変わったら、バッチをそこで割る。**
   * 旧実装はループの途中で resetLiveState() を呼びながら、append はループの**後**で
   * 1 回だけ行っていた。だから切り替え前の行が新しい空の store へ流れ込み、
   * 必ず非単調になって droppedRows を出していた。キーごとに分けてから順に流す。 */
  const batches=[]; let cur={key:liveSeenKey,lines:[],reset:false};
  for(const it of lines){
    const line=typeof it==='string'?it:(it&&it.d);
    const rawId=typeof it==='string'?'':((it&&it.id)||'');
    if(!line||!line.trim()) continue;
    if(rawId){
      const i=rawId.lastIndexOf(':');
      const key=i<0?'':rawId.slice(0,i);
      const off=Number(i<0?rawId:rawId.slice(i+1))||0;
      // **記録が変わった。** (繋ぎ直しの合間に水槽を立て直した場合。ここで気付かないと、
      //  新しい run の先頭の行を「もう見た位置」として捨てて spawn を取りこぼす)
      if(cur.key!==null&&key!==cur.key){ batches.push(cur); cur={key:key,lines:[],reset:true}; liveSeen=0; }
      cur.key=key; liveSeenKey=key;
      if(off&&off<=liveSeen) continue;     // 既に取り込んだ位置。捨ててよい唯一の場合。
                                           // **?from= はあくまで帯域の節約で、正しさの
                                           // 責任はここが持つ**(サーバはファイル回転時に
                                           // 黙って先頭から送り直す)。
      if(off>liveSeen){ liveSeen=off; liveSeenRun=LIVE_RUN; }
    }
    cur.lines.push(line);
  }
  batches.push(cur);
  for(const b of batches){
    if(b.reset){ D.gen=(D.gen||0)+1; resetLiveState(); LIVE_CLOCK.reset(); T.tick=0; T.acc=0; T.partial=0; }
    if(!b.lines.length) continue;
    D.store.append(b.lines);
    if(SHARED){
      const {events}=SHARED.parseTrace(b.lines.join('\n'));
      // final を渡さない —— まだ続きが来る(seriesFeed の docstring の hold-back 参照)。
      SHARED.seriesFeed(D.seriesState,events);
      D.series=SHARED.seriesLanes(D.seriesState);
    }
  }
  /* **履歴を窓で切る。ライブだけ。記録は全量のまま開く。**
   *
   * にーくら 2026-08-23:「正直前にもどれるのは2分だけでいいよ。本当にさかのぼりたく
   * なったら録画ボタンを押しておくし、それに、切り捨てられるとはいっても、
   * デバッグログは残るだろう？」 —— **記録がディスクに全量残ることが条件**。
   * jar は全部書いており、「記録」から開けば全長が読める。切るのはブラウザの手元だけ。
   *
   * ここで切る理由は**順序**: この下で D.entities / D.targetIds / SimGL.growDerived が
   * ストアの姿を読む。後ろへ回すと、その 1 回だけ「もう無い entity を指す targetIds」ができる。
   * trimBefore は maxTick に触れないので、直後の D.maxTick の読み出しは切っても同じ値。 */
  if(VIEWING_RECORD===null&&LIVE_WINDOW>0&&
     D.store.maxTick-D.store.minTick>LIVE_WINDOW+LIVE_SLACK){
    const r=D.store.trimBefore(D.store.maxTick-LIVE_WINDOW+1);
    T.trims=(T.trims||0)+1; T.trimMs=r.ms;
    // gl.js の walkPos は絶対 tick 索引の Float32Array。entity が消えても誰も読まない
    // まま残る(4 時間なら 1 体 1.1MB)ので、こちらでも忘れさせる。
    if(window.SimGL&&SimGL.forgetEntities) SimGL.forgetEntities(r.forgot);
    // 系列側の「同じ tick を二度食わせない」台帳も刈る(一度も刈られていなかった)。
    if(SHARED&&SHARED.seriesTrim&&D.seriesState) SHARED.seriesTrim(D.seriesState,r.minTick);
  }
  D.meta=D.store.meta; D.entities=D.store.entities;
  const _prevMax=D.maxTick;
  D.maxTick=D.store.maxTick<0?0:D.store.maxTick;
  // **保持(2400〜3000 tick で鋸歯)と表示(ぴったり 2400)を分ける。**
  // ストアの実際の床をそのまま出すと、30 秒ごとにバーの長さが 25% 跳ねる。
  D.minTick=(VIEWING_RECORD===null&&LIVE_WINDOW>0)?Math.max(0,D.maxTick-LIVE_WINDOW+1):0;
  // 1 回の取り込みで何 tick 届いたか。目標の遅れ(緩衝の厚み)は、この粒より大きい必要がある。
  { const _grew=D.maxTick-_prevMax, _s=LIVE_CLOCK.s;
    // BURST_MAX=20: 取り込みは 50ms 刻みで水槽は高々 20TPS なので、普通の粒は 1〜2 tick。
    // 20 を超えるのは一括読み込みか停止明けで、それは「粒」ではない —— 緩衝を厚くする
    // 判断は底に触れたかどうか(floorTouches)が持つべきで、この推定に混ぜてはいけない。
    if(_grew>20){ /* 粒ではない。無視する */ }
    else if(_grew>_s.burst) _s.burst=_grew;
    else _s.burst+=(1-_s.burst)*0.02; }   // τ≈2.5秒 で忘れる
  D.reimuId=D.store.reimuId;
  D.nTicks=D.maxTick+1;
  D._frameAtCache=null;
  D.targetIds=[...D.entities.values()].filter(e=>e.role==='target').map(e=>e.id);
  syncTraceSubjects();
  // D.key(name+'#'+D.gen) は変わらない(同じrunが続く限りD.genも変わらない) ——
  // gl.jsのsetTraceの早期returnを壊さないため、ここではD.key/D.pathを触らない。
  if(window.SimGL&&SimGL.available()&&SimGL.growDerived) SimGL.growDerived(D);
  const m=D.meta||{};
  document.getElementById('traceMeta').textContent=
    `${m.scenario??'?'} · arena ${m.arena??'?'} · ${D.maxTick+1} ticks · ${D.entities.size} entities`;
  // **時間の持ち主は loop() だけ。** ここで T.tick を動かすと追従の実装が 2 箇所に
  // 分かれる(旧実装のここのコメント自身がそう警告していた)。残すのは防御的な上限だけ。
  if(T.tick>D.maxTick){ T.tick=D.maxTick; T.acc=0; T.partial=0; }
  // **床が上がってきたら再生位置を連れていく。** 置いていくと「空の水槽」になって
  // 壊れて見える。連れて行けば「一番古い、まだ手元にある瞬間」が見える。
  const _onEdge=T.tick<D.minTick;
  if(_onEdge){ T.tick=D.minTick; T.acc=0; T.partial=0; }
  if(_onEdge&&!T._onEdge) tankSay('保持の端に達した（手元は直近2分）— 全部を見るなら「記録」から開く');
  T._onEdge=_onEdge;
  if(opts.frameCam) frameCam();
  // renderAiLog()/draw() は旧来の全文ローダの末尾がしていたのと同じ理由で明示的に呼ぶ
  // —— 60fps の rAF ループ(loop())は T.playing の間しか draw() を呼ばない
  // (index.html:1385 付近)。水槽を「一時停止のまま眺めている」(=再生していない)のが
  // 既定の見方なので、ここで呼ばないと新着データが届いても画面が更新されない。
  // resize() は無関係(window の実サイズは変わっていない、別途 resize イベントが処理する)。
  renderAiLog();
  // 実費は draw() の前に締める —— draw の時間は drawMs が別に持っているので、
  // ここに混ぜると「取り込みが重い」のか「描画が重い」のかが分からなくなる。
  T.ingestMs=performance.now()-_ingest0;
  T.ingestLines=(lines&&lines.length)||0;
  // 取り込めなかった行数を画面へ回す(perfTick が右下に出す)。**黙って欠けさせない。**
  // stats ではなく droppedRows を直に読む —— stats は全レーンの byteLength を合計するので、
  // 毎 ingest ここを通るとレーン 2 万本で 0.45ms を払う(2026-08-23 実測)。
  T.droppedRows=D.store.droppedRows||0;
  draw();
}

// ===== 状態 → 配信 の唯一の持ち主 ==============================================
// 2026-08-21 実測: 心拍バッジが「● tick 3240 — 生きている」を出している同じページで
// liveSrc は null・受信行 0・エンティティ 0 だった。呼び出し元が2つ(起動ボタンの起動
// ポーリングと、ページ読み込み時の1回だけの確認)しか無く、どちらも「このタブが自分で
// 起こした遷移」でしか通らなかったため、このタブが起こしたのでも読み込み時に既に在った
// のでもない live は、心拍バッジが緑になるだけで永遠に映らなかった。
// 持ち主を1つにする —— 既にある5秒ごとの見張りポーリングにここを通させる。

/** 開いている配信がどの run のものか。null = 開いていない。「もう開いたか」の旗ではない
 *  —— 旗はリロードで消えて liveSrc と二重帳簿になるが、これは liveSrc と対になった
 *  観測値なので、リロードすれば liveSrc ごと消えて自然に開き直る。値は status.trace を
 *  そのまま入れる(<scenario>/<date>/<runId>/arena-0.jsonl)。 */
let LIVE_RUN=null;

/** 記録を見ているならそのパス、今(ライブ)を見ているなら null。
 *  **ライブと記録は排他**という事実を、コードの側にも 1 つの値として置く。
 *  これが無かったので、記録を開いてもライブが追いかけてきて混ざっていた。 */
let VIEWING_RECORD=null;

/** 配信が実際に生きているか。liveSrc が在るだけでは足りない —— /api/live は心拍が
 *  死んでいると 409 を返し、EventSource は 200 以外では再接続しないまま
 *  CLOSED(readyState 2) で止まる。CLOSED を「開いている」と数えると二度と開き直せない
 *  (tankBeat の「状態が心拍より偉い」と同じ判例、index.html:1366-1370)。 */
function liveOpen(){ return !!liveSrc && liveSrc.readyState!==2; }

/**
 * 状態→配信 の唯一の持ち主。5秒ごとの見張りポーリングと起動ポーリング、そして
 * 読み込み時の初回確認、全部が同じ status をここへ渡す —— このタブが起こした遷移
 * かどうかを問わない。中で fetch はしない(status は呼び出し側が既に持っている)。
 */
function tankSyncLive(status){
  const state=status&&status.state;
  // **記録を見ている間は手を出さない。** ここは 5 秒ごとに永遠に呼ばれるので、
  // これが無いと記録を開いた 5 秒後に配信が開き直り、記録の上へライブが流れ込む。
  if(VIEWING_RECORD!==null) return;
  if(state==='live'){
    const run=status.trace;
    // 健康な配信は張り直さない —— ここは5秒ごとに永遠に呼ばれ続けるので、
    // 同じ run を渡されるたびに開き直すと SSE 接続とタイマーが積み上がる。
    if(liveOpen()&&LIVE_RUN===run) return;
    if(LIVE_RUN!==run) TANK_FRAMED=false;   // 別の水槽に入れ替わった —— カメラは寄せ直しの対象へ
    LIVE_RUN=run;
    loadTankEntities();   // 放つドロップダウンを埋めるだけ。待つ必要が無い。
    // run を渡す —— openLive はこれを liveSeenRun と比べて「同じ記録の繋ぎ直しか」を
    // 決める。同じなら store を捨てずに ?from= で続きから受ける(巻き戻り対策)。
    const wasSameRun=(liveSeenRun===run&&liveSeen>0);
    openLive(run);
    tankSay(wasSameRun?'配信を繋ぎ直した（続きから）':'走っている水槽に繋いだ');
  }else{
    if(!liveSrc&&LIVE_RUN===null) return;   // 既に閉じている —— 5秒ごとの無駄な仕事をしない
    closeLive();
    LIVE_RUN=null;
    TANK_FRAMED=false;
  }
}

/**
 * 放てるモブの一覧を読む。**jar が書いたものをそのまま並べる。**
 * 絞り込みも並べ替えもしない —— サイトはモブについて判断を持たない。
 * mods/ に mod を足せば選択肢が勝手に増える。
 */
async function loadTankEntities(){
  try{
    const j=await (await fetch('/api/entities')).json();
    if(!j||!j.entities) return;
    TANK_ENTITIES=j.entities;
    // mod の選択肢。**jar が返した namespace をそのまま並べる。**
    // にーくら『絞り込みでいいかな。すべての jar をロードさせると重いかもしれないし』
    const mods=[...new Set(j.entities.filter(e=>e.summonable).map(e=>e.mod))].sort();
    if(!mods.includes(TANK_MOD)) TANK_MOD='*';
    tankDropdown(document.getElementById('ddMod'),
      [{value:'*',label:'すべての mod（'+j.summonable+' 種）'}].concat(mods.map(m=>({value:m,label:m}))),
      TANK_MOD,
      (v)=>{ TANK_MOD=v; loadTankEntitiesRefresh(); });
    // 「放つ」節は常設(§4)。中身は状態に関わらず表示され、活性/休眠は
    // tankRenderAction() が #tankSpawn の .dormant で切り替える —— ここでは触らない。
    fillTankTypes();
  }catch{ /* 一覧がまだ無い＝一度も水槽を立てていない */ }
}

/** mod を選び直したとき。両方のドロップダウンを描き直す。 */
function loadTankEntitiesRefresh(){
  const mods=[...new Set(TANK_ENTITIES.filter(e=>e.summonable).map(e=>e.mod))].sort();
  tankDropdown(document.getElementById('ddMod'),
    [{value:'*',label:'すべての mod'}].concat(mods.map(m=>({value:m,label:m}))),
    TANK_MOD,
    (v)=>{ TANK_MOD=v; loadTankEntitiesRefresh(); });
  fillTankTypes();
}
/* ============================================================================
   水槽パネル —— 3D の上に浮かぶ操作卓

   にーくら『design系ツールでお願い。メニューでスポーンなんて利便性が悪すぎ』

   ネイティブの <select>/<datalist> を使わない理由: **配色を制御できない。**
   にーくらの環境で白背景に白文字になり、読めずスクロールもできなかった
   (2026-08-20 の写真)。OS の描画に委ねている限り直しようがないので、
   ドロップダウンは div で自作する。
   ============================================================================ */
let TANK_ENTITIES=null;      // jar が書いた一覧（サイトは中身を解釈しない）
let TANK_MOD='touhou_little_maid';
let TANK_LIVE_AT_END=true;   // 最新に追従しているか
let TANK_FRAMED=false;       // 最初の 1 体が現れたときに一度だけカメラを寄せたか

const TANK_CSS=`
#tankPanel{position:absolute;left:12px;top:12px;z-index:30;width:262px;
  padding:11px 12px 10px;border-radius:9px;
  /* **不透明にする。** 半透明だと後ろの F3 テキストが透けて読めなくなる */
  background:#14161c;border:1px solid rgba(255,255,255,.13);
  box-shadow:0 8px 28px rgba(0,0,0,.55);
  font-size:12px;line-height:1.45;user-select:none}
#tankPanel .sec{font-size:10px;letter-spacing:.1em;color:#7d838f;margin:11px 0 5px}
#tankPanel .sec:first-child{margin-top:0}
#tankPanel .row{display:flex;gap:5px;align-items:center}
#tankPanel input{padding:4px 7px;border-radius:5px;border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.04);color:#e8eaee;font:inherit;min-width:0}
#tankPanel input:focus{outline:none;border-color:#5b8dd6;background:rgba(91,141,214,.10)}
#tankPanel button{padding:4px 10px;border-radius:5px;border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.06);color:#e8eaee;font:inherit;cursor:pointer;white-space:nowrap}
#tankPanel button:hover{background:rgba(255,255,255,.12)}
#tankPanel button:disabled{opacity:.4;cursor:default}
#tankPanel .primary{background:#2f5d9e;border-color:#3f74bd}
#tankPanel .primary:hover{background:#396fbb}
/* **停止系(danger)は「起動系(primary)」と混同しないための独立配色。**
   にーくら『写真の起動と停止、なんの役に立つかすらわからないんだ』(§7-1) を受け、
   ボタンは常に1つだが、その1つが「押すと立つ」か「押すと落ちる」かは色でも判る必要がある。
   彩度を上げた警告赤ではなく、パネル全体の落ち着いたトーンに合わせた濁った赤にする。 */
#tankPanel .danger{background:#5a3232;border-color:#7a4040}
#tankPanel .danger:hover{background:#6b3b3b}
#tankAct{width:100%;margin-top:6px;padding:6px 10px}
#tankHint{font-size:11px;color:#8a8f99;margin-top:5px;word-break:break-word;min-height:15px}
/* 自作ドロップダウン —— 配色もスクロールも自分の手に在る */
#tankPanel .dd{position:relative}
#tankPanel .dd>.cur{display:flex;justify-content:space-between;align-items:center;gap:6px;
  padding:5px 8px;border-radius:5px;border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.04);cursor:pointer;overflow:hidden}
#tankPanel .dd>.cur span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tankPanel .dd>.list{display:none;position:absolute;left:0;right:0;top:calc(100% + 3px);
  z-index:40;max-height:212px;overflow-y:auto;border-radius:6px;
  background:#1b1e26;border:1px solid rgba(255,255,255,.16);
  box-shadow:0 10px 26px rgba(0,0,0,.6)}
#tankPanel .dd.open>.list{display:block}
#tankPanel .dd .it{padding:5px 9px;cursor:pointer;color:#d6d9e0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tankPanel .dd .it:hover{background:#2a3040}
#tankPanel .dd .it.on{background:#2f5d9e;color:#fff}
#tankPanel .dd .list::-webkit-scrollbar{width:9px}
#tankPanel .dd .list::-webkit-scrollbar-thumb{background:#3a4152;border-radius:5px}
#tankPanel .who{max-height:104px;overflow-y:auto;font-size:11.5px;color:#b9bec8}
#tankPanel .who div{display:flex;justify-content:space-between;gap:8px;padding:1px 0}
#tankPanel .who .id{color:#6f7583}
/* 消す × は**普段は目立たせない**。並んでいるのは「今そこに居るもの」の一覧であって
   ボタンの一覧ではないので、行の上に来たときだけ赤くする。 */
#tankPanel .whoKill{
  margin-left:6px;background:none;border:0;color:#4d525c;cursor:pointer;
  font-size:12px;line-height:1;padding:0 2px;border-radius:2px;
}
#tankPanel .who div:hover .whoKill{color:#8a8f99}
#tankPanel .whoKill:hover{color:#e06c6c;background:#2a1c1c}
#tankPanel .msg{font-size:11px;color:#8a8f99;margin-top:8px;word-break:break-word;min-height:15px}
/* 心拍の波形。テキストより先に目が行く、このパネルで唯一の主張の強い要素にする。 */
#tankPulse{width:100%;height:18px;display:block;margin:4px 0 8px}
/* **「放つ」は消えない。** 水槽が無いときは触れないが、居ることは常に見える
   (にーくら『メニューでスポーンなんて利便性が悪すぎ』への対応が、出たり消えたりする
   節では逆効果になる —— 何ができる道具かが見えなくなる)。 */
#tankSpawn.dormant{opacity:.45;pointer-events:none}
#tankSpawn .dormant-msg{display:none;font-family:var(--sans);font-size:11px;color:var(--ink-faint);margin-bottom:6px}
#tankSpawn.dormant .dormant-msg{display:block}
/* 休眠中に出す説明は「水槽が立つと放てる。」の一行だけにする。狙いの付け方まで
   積むと、まだ何もできない欄に読む理由の無い文が2つ並ぶ(2026-08-21 に撮って確認)。 */
#tankSpawn.dormant #tankPickReadout{display:none}
/* 「記録」節の開閉トグル。にーくらが 0 KB のトレースを24本の壁から拾わされた
   反省 —— 既定は畳んでおき、中身は展開したときだけ計算する。 */
#recToggle{cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none}
#recToggle:hover{color:#a8adb6}
#recToggle:focus-visible{outline:2px solid #5b8dd6;outline-offset:2px}
#recCaret{display:inline-block;width:9px}
#recList{max-height:220px;overflow-y:auto;margin:2px 0 6px}
#recList::-webkit-scrollbar{width:9px}
#recList::-webkit-scrollbar-thumb{background:#3a4152;border-radius:5px}
/* シナリオ名(パスの第1セグメント)ごとの見出し。件数つき。データなので等幅。 */
.recGroup{font-family:var(--mono);font-size:10.5px;color:#7d838f;margin:8px 0 3px}
.recGroup:first-child{margin-top:0}
.recRow{display:flex;justify-content:space-between;gap:8px;width:100%;
  padding:3px 6px;border-radius:4px;border:none;background:transparent;
  color:#d6d9e0;cursor:pointer;text-align:left;font:inherit}
.recRow:hover{background:rgba(255,255,255,.08)}
/* 0 KB = 記録が空のまま終わった run。**隠さない** —— それ自体が何も起きなかった証拠。 */
.recRow.empty{opacity:.5}
/* **F3 のテキストをパネルの右へ逃がす。**
   オーバーレイは左上から書き始めるので、パネルの下に潜り込んで
   「被って読めない」状態になっていた（2026-08-20、撮って確認）。 */
#overlay{padding-left:288px}
#tankLive{position:absolute;right:12px;top:12px;z-index:30;display:none;gap:6px;align-items:center;
  padding:5px 10px;border-radius:7px;background:#14161c;
  border:1px solid rgba(255,255,255,.13);font-size:11.5px}
/* 床の狙いの輪。**design系ツールの手応え**——押す前に、どこへ落ちるか見える。
   pointer-events:none なので、輪の上でクリックしてもピックを食わない。 */
#tankMarker{position:absolute;left:0;top:0;width:14px;height:14px;
  margin-left:-7px;margin-top:-7px;border-radius:50%;
  border:2px solid #6cc06c;background:rgba(108,192,108,.18);
  pointer-events:none;display:none;z-index:25}
`;

/** 自作ドロップダウン。**ネイティブ select を使わない** —— 配色を握るため。 */
function tankDropdown(el,items,current,onPick){
  const cur=el.querySelector('.cur span');
  const list=el.querySelector('.list');
  cur.textContent=current||'選ぶ';
  list.innerHTML=items.map(it=>
    '<div class="it'+(it.value===current?' on':'')+'" data-v="'+it.value+'">'+it.label+'</div>').join('')
    ||'<div class="it" style="color:#6f7583">該当なし</div>';
  list.onclick=(e)=>{
    const it=e.target.closest('.it');
    if(!it||!it.dataset.v) return;
    el.classList.remove('open');
    onPick(it.dataset.v);
  };
}

async function buildTankUi(){
  const host=document.getElementById('stageWrap');
  if(!host) return;

  const style=document.createElement('style');
  style.textContent=TANK_CSS;
  document.head.appendChild(style);

  const p=document.createElement('div');
  p.id='tankPanel';
  p.innerHTML=
    // ---- 水槽: 心拍 / 波形 / 単一の操作ボタン / 一行の文 ----
    '<div class="sec">水槽</div>'+
    '<span id="tankBeat" style="font-size:11.5px;color:#8a8f99;display:block">● 未起動</span>'+
    '<canvas id="tankPulse" width="238" height="18"></canvas>'+
    // にーくら『写真の起動と停止、なんの役に立つかすらわからないんだ』(§7-1)。
    // ボタンは常に1つ —— 今できる操作だけを見せ、色と一行の文で結果を先に言う。
    // 中身は tankActionFor()/tankRenderAction() が state から組み立てる。
    '<button id="tankAct"></button>'+
    '<div id="tankHint"></div>'+
    // ---- 放つ: 水槽が無いときも消えない(§4)。触れるかどうかを .dormant で切り替える ----
    '<div class="sec">放つ</div>'+
    '<div id="tankSpawn" class="dormant">'+
      '<div id="tankSpawnMsg" class="dormant-msg">水槽が立つと放てる。</div>'+
      '<div class="dd" id="ddMod" style="margin-bottom:5px">'+
        '<div class="cur"><span></span><span style="color:#7d838f">▾</span></div>'+
        '<div class="list"></div></div>'+
      '<div class="dd" id="ddType" style="margin-bottom:6px">'+
        '<div class="cur"><span></span><span style="color:#7d838f">▾</span></div>'+
        '<div class="list"></div></div>'+
      // 座標は打たない —— 実機タブで床をクリックして狙う (§7-2)。
      // にーくら『メニューでスポーンなんて利便性が悪すぎ。design系ツールでお願い』。
      '<div id="tankPickReadout" style="font-size:11px;color:#8a8f99;margin-bottom:6px">'+
        '実機タブで床をクリックして狙いを定める。高さは選べない —— 床に立ち、飛ぶモブは自分で上がる。</div>'+
      '<div class="row">'+
        '<button class="primary" id="tankSummon" style="flex:1">放つ</button>'+
      '</div>'+
      // **水槽を実機と違わせる設定は、ここに固めて置く。** 散らすと「今どう違うのか」が
      // 判らなくなる。既定は on（にーくらの要望）だが、違っていることは字で言う。
      '<div class="sec">水槽のつまみ</div>'+
      '<label style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-dim);padding:2px 0">'+
        '<input type="checkbox" id="tankItemTtl" checked>'+
        '<span>落ちた物を1秒で消す<span style="color:var(--ink-faint)"> — 実機は5分。拾いの検証をするときは外す</span></span>'+
      '</label>'+
      '<div class="sec">中にいる <span id="tankWhoN" style="color:#b9bec8"></span></div>'+
      '<div class="who" id="tankWho"></div>'+
    '</div>'+
    // ---- YSM アニメ (S6): 実機を起動せずにアニメを確認する ----
    // にーくら 2026-08-24:「YSMモデルについてのアニメーションも、実機を起動して
    // わざわざ確認するのが面倒でね。水槽で確認できたら楽かなって思ったんだ」
    // 出どころは animsweep のライブラリ = **実機レンダラが出した頂点**なので、
    // ysm.js の再構成も CONTROLLER_WEIGHT_FIT=0.45 も通らない。
    // トレースも水槽も要らずに動く（起動直後の空の水槽でそのまま使える）。
    '<div class="sec" id="animToggle" role="button" tabindex="0" aria-expanded="false">'+
      '<span><span id="animCaret">▸</span> YSM アニメ</span>'+
      '<span class="num" id="animCount" style="color:var(--ink-dim)"></span>'+
    '</div>'+
    '<div id="animBody" style="display:none">'+
      '<input id="animFilter" placeholder="名前で絞る（例 extra4 / attack）" '+
        'style="width:100%;box-sizing:border-box;background:#15171b;border:1px solid #2a2e36;'+
        'color:var(--ink);border-radius:4px;padding:4px 6px;font-size:11px;margin-bottom:4px">'+
      '<div id="animList" style="max-height:190px;overflow:auto;font-size:11px"></div>'+
      '<div id="animPlayRow" style="display:none;align-items:center;gap:6px;margin-top:6px">'+
        '<button class="btn" id="animPlay" style="min-width:34px">▶</button>'+
        '<input type="range" id="animFrame" min="0" max="19" value="0" style="flex:1">'+
        '<span id="animFrameN" class="num" style="min-width:44px;text-align:right"></span>'+
      '</div>'+
      '<div id="animStatus" style="font-size:11px;color:var(--ink-faint);margin-top:4px"></div>'+
    '</div>'+
    // ---- 記録: 既定は畳む。にーくらが 0 KB のトレースを24本の壁から拾わされた反省 ----
    '<div class="sec" id="recToggle" role="button" tabindex="0" aria-expanded="false">'+
      '<span><span id="recCaret">▸</span> 記録</span>'+
      '<span class="num" id="recCount" style="color:var(--ink-dim)"></span>'+
    '</div>'+
    '<div id="recBody" style="display:none">'+
      '<div id="recList"></div>'+
      '<div class="drop" id="drop">手元の <span class="num">arena-0.jsonl</span> を開く '+
        '<button id="pick">ファイルを選ぶ</button></div>'+
      '<input type="file" id="file" accept=".jsonl" hidden>'+
    '</div>'+
    '<div class="msg" id="tankMsg"></div>';
  host.appendChild(p);
  tankUpdatePickReadout();
  tankPulseDraw();   // 心拍0件でも、空白ではなく細い水平線を最初から出す

  // 「記録」の開閉。既定は畳んである —— にーくらが 0 KB のトレースを24本の壁から
  // 拾わされた反省(この quick の <why>)。中身は renderRecords() が別途組む。
  document.getElementById('recToggle').onclick=()=>tankRecordsSetOpen(!TANK_RECORDS_OPEN);
  document.getElementById('recToggle').addEventListener('keydown',(e)=>{
    if(e.key==='Enter'||e.key===' '){ e.preventDefault(); tankRecordsSetOpen(!TANK_RECORDS_OPEN); }
  });
  // ファイル選択。元は #empty 直下にあった静的マークアップだったが、その節ごと廃止した
  // ので、生成後のここで配線する(トップレベルの静的配線は要素が無い時点で例外になる)。
  document.getElementById('pick').onclick=()=>document.getElementById('file').click();
  document.getElementById('file').onchange=(e)=>{
    const f=e.target.files[0]; if(!f) return;
    f.text().then(tx=>load(tx,f.name));
  };

  // 追従バッジ。**今見ているのが最新かどうかを、常に画面に出す。**
  const live=document.createElement('div');
  live.id='tankLive';
  live.innerHTML='<span id="tankLiveTxt"></span>'+
    '<button id="tankToEnd" style="padding:2px 8px;display:none">最新へ</button>'+
    '<button id="tankOpenRec" style="padding:2px 8px;display:none" title="手元の窓より前は「記録」に全部残っている">記録を開く</button>'+
    '<button id="tankToLive" style="padding:2px 8px;display:none">今へ戻る</button>';
  host.appendChild(live);
  document.getElementById('tankToEnd').onclick=()=>{ seekToLive(); TANK_LIVE_AT_END=true; tankLiveBadge(); };
  document.getElementById('tankOpenRec').onclick=()=>{ tankRecordsSetOpen(true); tankSay('記録には全長が残っている —— 開きたいものを選ぶ'); };
  // **記録から今へ戻る唯一の道。** これが無いと、記録を開いたら戻れない。
  document.getElementById('tankToLive').onclick=()=>tankBackToLive();

  // ドロップダウンの開閉。外side クリックで閉じる。
  p.addEventListener('click',(e)=>{
    const cur=e.target.closest('.cur');
    for(const dd of p.querySelectorAll('.dd')){
      if(cur&&dd.contains(cur)) dd.classList.toggle('open');
      else dd.classList.remove('open');
    }
  });
  document.addEventListener('click',(e)=>{
    if(!p.contains(e.target)) for(const dd of p.querySelectorAll('.dd')) dd.classList.remove('open');
  });

  // ()=>summonFromPanel() —— click イベントを summonFromPanel の引数に誤って
  // 渡さないため(既定は直近の床クリック TANK_PICK を使う)。
  document.getElementById('tankSummon').onclick=()=>summonFromPanel();
  // 落ちた物の寿命。**押した結果を必ず言う** —— 黙って効くと「実機と違う状態」を
  // 忘れたまま観察することになる。水槽が立っていなければ 409 が返るので、それも言う。
  document.getElementById('tankItemTtl').onchange=async(e)=>{
    const on=e.target.checked, ticks=on?20:0;
    try{
      const r=await fetch('/api/tank/itemttl?ticks='+ticks);
      const j=await r.json();
      if(!r.ok){ e.target.checked=!on; tankSay('× '+(j.error||r.status)); return; }
      tankSay(on?'落ちた物を1秒で消す（実機は5分）':'落ちた物の寿命を実機と同じに戻した（5分）');
    }catch(err){ e.target.checked=!on; tankSay('× 水槽へ届かなかった'); }
  };

  // ---- 起動 ----
  // **押している間だけ「起動ポーリング」を握る**（TANK_START_IN_FLIGHT）。
  // 5s ごとの見張りポーリング(下)と同時に描くと、2つが同じボタンを取り合って
  // ちらつく／早口で描き直る事故になるので、どちらか一方だけが描く。
  async function tankStartAction(){
    TANK_START_IN_FLIGHT=true;
    tankRenderAction({state:'running',started:Date.now()});
    tankSay('起動中…（Minecraft が立つまで 1〜2 分）');
    try{
      const r=await fetch('/api/run?scenario=tank');
      const j=await r.json();
      if(!r.ok){
        tankSay('× '+(j.error||r.status));
        TANK_START_IN_FLIGHT=false; tankRenderAction({state:'error',error:j.error||String(r.status)});
        return;
      }
    }catch(e){
      tankSay('× '+e);
      TANK_START_IN_FLIGHT=false; tankRenderAction({state:'error',error:String(e)});
      return;
    }
    for(;;){
      await new Promise(res=>setTimeout(res,2000));
      let st;
      try{ st=await (await fetch('/api/run/status')).json(); }catch{ continue; }
      // 経過秒はここ(status.started)から一箇所で出す。tankSay を毎tickで更新しない。
      tankRenderAction(st);
      if(st.state==='live'){
        tankBeat(st.heartbeat,st.state);
        tankSyncLive(st);
        // tankSyncLive が既に「走っている水槽に繋いだ」を言っている。このボタンが
        // 起こした遷移では、それより起動固有の文を優先する —— 上書きされないよう
        // **後に**言う(1つの経路につき文の持ち主は1つ)。
        tankSay('水槽が立った —— 誰もいない。放つと始まる。');
        TANK_START_IN_FLIGHT=false; return;
      }
      if(st.state==='error'){ tankSay('× '+(st.error||'失敗')); TANK_START_IN_FLIGHT=false; return; }
    }
  }

  // ---- 停止 ----
  async function tankStopAction(){
    closeLive();
    try{
      const r=await fetch('/api/run/stop'); const j=await r.json().catch(()=>({}));
      const stoppedState=(j&&j.state)||'stopped';
      tankSay('止めた'); tankBeat(null,stoppedState); TANK_FRAMED=false;
      tankRenderAction({state:stoppedState});
    }catch(e){ tankSay('× '+e); }
  }

  // 起動/停止をここへ集約する。tankActionFor() は文字列だけを見る純粋な対応表、
  // tankRenderAction() が実データ(経過秒/エラー文/live直後ガード)を足して DOM へ出す。
  TANK_ACT_HANDLERS.start=tankStartAction;
  TANK_ACT_HANDLERS.stop=tankStopAction;

  // 心拍が途絶えたら、誰も押さなくても 5s 以内にボタンが「起動」へ戻る
  // (HANDOFF §1: 止まった監視カメラが最新を映し続けるのが最悪の壊れ方)。
  // 起動ポーリング(上)が握っている間は、取り合わないよう休む。
  // **ここが本命の経路。** このタブが起こしたのでも読み込み時に既に在ったのでもない
  // live(=よそが起こした水槽)は、ここでしか拾えない —— tankSyncLive の唯一の常駐呼び出し元。
  setInterval(async()=>{
    if(TANK_START_IN_FLIGHT) return;
    let st;
    try{ st=await (await fetch('/api/run/status')).json(); }catch{ return; }
    tankRenderAction(st);
    tankBeat(st.heartbeat,st.state);
    tankSyncLive(st);
    // **「繋がっているフリ」を拾う。** liveOpen() は readyState 0(CONNECTING) も真に
    // 数えるので、接続がそこで固まると tankSyncLive の早期 return を毎回通り抜け、
    // 緑バッジのまま永遠に空の水槽を映し続ける(止まった監視カメラの最悪の形)。
    // 心拍は serve.mjs が 1 秒ごとに流しているので、15 秒来なければ死んでいる。
    // 貼り直しは resume なので store を捨てない —— もう安い。
    if(VIEWING_RECORD===null&&liveOpen()&&LIVE_RUN&&
       performance.now()-LIVE_CLOCK.s.beatAt>15000){
      LIVE_CLOCK.s.drops++;
      tankSay('配信が黙っている（15 秒）—— 貼り直す');
      openLive(LIVE_RUN);
    }
  },5000);

  // 初回描画。以後の再接続・ポーリング・押下は、すべて同じ tankRenderAction を通す。
  // live 判定と openLive の直呼びはやめ、tankSyncLive へ委ねる —— 文はもう
  // tankSyncLive が言うので、ここでは言わない。
  try{
    const st=await (await fetch('/api/run/status')).json();
    tankRenderAction(st);
    tankBeat(st.heartbeat,st.state);
    tankSyncLive(st);
  }catch{ tankRenderAction({state:'idle'}); }
}

/** 追従バッジを描く。**最新を見ているか、過去を見ているかを常に出す。** */
function tankLiveBadge(){
  const box=document.getElementById('tankLive');
  const txt=document.getElementById('tankLiveTxt');
  const btn=document.getElementById('tankToEnd');
  const back=document.getElementById('tankToLive');
  if(!box||!txt) return;
  // **記録を見ている**: ライブとは別の状態なので、そう言って戻り道を出す。
  // ここを出さないと「記録を開いたら戻れない」ことになる(にーくら 2026-08-22)。
  if(VIEWING_RECORD!==null){
    box.style.display='flex';
    const name=String(VIEWING_RECORD).split('/').slice(-2,-1)[0]||VIEWING_RECORD;
    // **「全量」と言う。** ライブ側が「手元は直近2分」と言うので、両側から言って初めて
    // 取引が見える —— 何を捨てて何が残っているのかが、どちらの画面からも判る。
    txt.textContent='■ 記録を見ている（全量） — '+name;   // textContent なので trace 名の中身を素通しできる
    if(btn) btn.style.display='none';
    if(back) back.style.display='';
    const rb=document.getElementById('tankOpenRec'); if(rb) rb.style.display='none';
    return;
  }
  if(back) back.style.display='none';
  const recBtn=document.getElementById('tankOpenRec');
  if(!liveSrc){ box.style.display='none'; if(recBtn) recBtn.style.display='none'; return; }
  box.style.display='flex';
  // **判定は T.followLive を読むだけ。** 以前はここに `T.tick>=D.maxTick-3` という
  // loop() の LIVE_LAG=2 の写しがあり、片方を直すたびにずれた(3 箇所に同じ判定があった)。
  // **手元にどれだけあるかを常に添える。** にーくらが切り捨てを受け入れた条件が
  // 「記録は全部残っている」だったので、その約束を画面から消さない。
  const held=(D.minTick||0)>0
    ?'<span style="color:var(--ink-dim);font-size:11px"> · 手元は直近'+Math.round(LIVE_WINDOW/20/60)+'分 · 記録は全部残っている</span>':'';
  const atFloor=(D.minTick||0)>0&&T.tick<=(D.minTick||0)+1;
  if(atFloor){
    // **端に居ることは、端に居るときだけ言う。** ここで初めて「記録を開く」を出す ——
    // 困った場所に道具を置く(メニューの奥ではなく)。
    txt.innerHTML='<span style="color:#d6b25b">●</span> これより前は手元に無い'+held;
    btn.style.display='';
    if(recBtn) recBtn.style.display='';
  }else if(T.followLive){
    const tr=LIVE_CLOCK.s.trim;
    txt.innerHTML='<span style="color:#6cc06c">●</span> 最新を映している'
      +(tr>1.15?'（追いつき中 ×'+tr.toFixed(1)+'）':'')+held;
    btn.style.display='none';
    if(recBtn) recBtn.style.display='none';
  }else{
    const behind=D.maxTick-T.tick;
    txt.innerHTML='<span style="color:#d6b25b">●</span> '+behind+' tick 前を見ている'+held;
    btn.style.display='';
    if(recBtn) recBtn.style.display='none';
  }
}

/** 水槽の中に今いるものを並べる。**放てたかどうかが、これで判る。** */
function tankWho(){
  const box=document.getElementById('tankWho');
  const n=document.getElementById('tankWhoN');
  if(!box) return;
  // **描画と同じ鍵で引く。** D._frameAtCache は 1 件しか持たないので、ここが (t,0) で
  // 引くと 50ms ごとにキャッシュを叩き落とし、次の draw() も組み直しになる
  // (フレームの組み立てが二重になる)。この一覧に partial の差は関係しない。
  const f=D.frameAt(T.tick,T.partial);
  if(!f){ box.innerHTML=''; if(n) n.textContent=''; return; }
  const rows=[];
  for(const [id,pos] of f.pos){
    const e=D.entities.get(id);
    if(!e||e.role==='projectile') continue;   // 弾は数えない（すぐ消えるので）
    const short=String(e.type||'?').replace(/^[a-z0-9_.-]+:/,'');
    const hp=pos.hp!==undefined?(' '+pos.hp.toFixed(0)):'';
    // **消す手を、居るものの隣に置く。** メニューを探させない (放つのが床クリックなのと同じ思想)。
    // uuid が無い記録 (2026-08-23 より前のトレース) では × を出さない —— 押せない
    // ボタンを見せるより、無いほうが正直。
    const kill=e.uuid&&liveOpen()
      ?'<button class="whoKill" title="この個体を消す" data-uuid="'+e.uuid+'" data-name="'+short+'">×</button>'
      :'';
    rows.push('<div><span>'+short+hp+'</span><span class="id">#'+id+kill+'</span></div>');
  }
  if(n) n.textContent='('+rows.length+')';
  box.innerHTML=rows.length?rows.join('')
    :'<div style="color:#6f7583">まだ誰もいない。床をクリックして放つ。</div>';
  for(const b of box.querySelectorAll('.whoKill')){
    b.onclick=(ev)=>{ ev.stopPropagation(); killFromPanel(b.dataset.uuid,b.dataset.name); };
  }
}

/** 名指しで片付ける。**確認は出さない** —— 水槽は壊してよい場所で、押し間違えても放ち直せる。 */
async function killFromPanel(uuid,name){
  try{
    const r=await fetch('/api/kill?uuid='+encodeURIComponent(uuid));
    const j=await r.json();
    tankSay(r.ok?('消した — '+(name||'')):('× '+(j.error||r.status)));
  }catch(e){ tankSay('× '+e); }
}

/**
 * 放つ。座標は引数(既定 = 直近の床クリック TANK_PICK、無ければアリーナ原点の床)。
 * 数値入力は無い —— §7-2 のとおり、狙いは常にクリックから来る。
 */
async function summonFromPanel(point){
  const type=TANK_TYPE;
  if(!type){ tankSay('放つモブを選ぶ'); return; }
  const p=point||TANK_PICK||tankOriginFloor();
  const q='/api/summon?type='+encodeURIComponent(type)
    +'&x='+encodeURIComponent(p.x)
    +'&y='+encodeURIComponent(p.y)
    +'&z='+encodeURIComponent(p.z);
  try{
    const r=await fetch(q); const j=await r.json();
    tankSay(r.ok?('放った — '+String(j.reply||'').trim()):('× '+(j.error||r.status)));
  }catch(e){ tankSay('× '+e); }
}

let TANK_TYPE=null;

/** mod で絞ってモブの選択肢を作り直す。**並べ替えない** —— jar が返した順のまま。 */
function fillTankTypes(){
  const dd=document.getElementById('ddType');
  if(!dd||!TANK_ENTITIES) return;
  const list=TANK_ENTITIES.filter(e=>e.summonable&&(TANK_MOD==='*'||e.mod===TANK_MOD));
  if(!list.some(e=>e.id===TANK_TYPE)) TANK_TYPE=list.length?list[0].id:null;
  tankDropdown(dd,
    list.map(e=>({value:e.id,label:e.id.replace(/^[a-z0-9_.-]+:/,'')})),
    TANK_TYPE,
    (v)=>{ TANK_TYPE=v; fillTankTypes(); });
}

/* ============================================================================
   記録 —— #tankPanel の3番目の節 (§4)。/api/traces が返すのは path と size だけ
   (シナリオ名もタイムスタンプも tick 数もエンティティ数も持たない)。
   サイトはこれを**整形するだけ**——パス文字列からシナリオ名とタイムスタンプを
   読み取る計算は、値の解釈であって霊夢の判断ではない(doctrine上「置いてよい」側)。
   ============================================================================ */
let TANK_RECORDS_OPEN=false;

/** パスの第1セグメント=シナリオ名、"YYYYMMDD-HHMMSS" セグメント=タイムスタンプ。
    どちらも実測(/api/traces, 2026-08-21): "tank/20260820/20260821-031644/arena-0.jsonl"。
    古い記録は日付だけの2段構成("stairs/20260814/arena-0.jsonl")もあるので、
    時刻が無い場合は em dash で明示する(作っていない値を 00:00 と偽らない)。 */
function tankRecordParse(p){
  const segs=String(p).split('/');
  const scenario=segs[0]||p;
  for(const s of segs){
    const m=/^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})(\d{2})$/.exec(s);
    if(m) return {scenario, stamp:`${m[2]}/${m[3]} ${m[4]}:${m[5]}`};
  }
  for(const s of segs){
    const m=/^(\d{4})(\d{2})(\d{2})$/.exec(s);
    if(m) return {scenario, stamp:`${m[2]}/${m[3]} —`};
  }
  return {scenario, stamp:'—'};
}

function escAttr(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }

/** 記録を開く。**これはライブから離れる操作である。**
 *
 * ライブと記録は排他 —— 同じ D.store に両方を流し込むと混ざる。実際、閉じずに
 * load() すると 1 秒後の appendLive() が「今のライブ」の行を「開いたばかりの記録」へ
 * 追記していた(にーくら 2026-08-22「トレースタブを展開した際、戻せない」)。
 * closeLive() だけでは足りない —— 5 秒ごとの見張り tankSyncLive() が
 * state==='live' を見て openLive() で開き直すので、VIEWING_RECORD で
 * 「今は記録を見ている」と宣言し、見張りに手を出させない。戻るのは tankBackToLive()。 */
async function tankRecordOpen(path){
  const t=await (await fetch('/api/trace?path='+encodeURIComponent(path))).text();
  closeLive();
  VIEWING_RECORD=path;
  load(t,path);
  tankLiveBadge();
}

/** 記録から「今」へ戻る。水槽が生きていれば次の見張りが配信を開き直す。 */
function tankBackToLive(){
  VIEWING_RECORD=null;
  LIVE_RUN=null;          // 同じ run でも開き直させる(liveOpen() は false なので素通りしない)
  TANK_FRAMED=false;      // 誰か居れば寄せ直す
  tankLiveBadge();
  tankSay('今へ戻る —— 次の見張りで配信を開き直す');
}

/** /api/traces の結果を「シナリオごとにグループ化した行」へ整形するだけ。
    並び順はサーバの応答順(新しい順)をそのまま保つ —— ここで並べ替えない。 */
function renderRecords(list){
  const items=list||[];
  const count=document.getElementById('recCount');
  if(count) count.textContent=items.length+' 件';
  const box=document.getElementById('recList');
  if(!box) return;
  if(!items.length){ box.innerHTML=''; return; }

  const groups=new Map();
  for(const it of items){
    const {scenario,stamp}=tankRecordParse(it.path);
    if(!groups.has(scenario)) groups.set(scenario,[]);
    groups.get(scenario).push({path:it.path,size:it.size,stamp});
  }

  const html=[];
  for(const [scenario,rows] of groups){
    html.push(`<div class="recGroup">${scenario}（${rows.length}）</div>`);
    for(const it of rows){
      const empty=it.size===0;
      const size=empty?'空のまま終了':Math.round(it.size/1024)+' KB';
      html.push(
        `<button class="recRow${empty?' empty':''}" data-path="${escAttr(it.path)}">`+
          `<span class="num">${it.stamp}</span>`+
          `<span class="num" style="color:var(--ink-faint)">${size}</span>`+
        `</button>`);
    }
  }
  box.innerHTML=html.join('');
  box.querySelectorAll('.recRow').forEach(b=>{ b.onclick=()=>tankRecordOpen(b.dataset.path); });
}

/** 開閉。既定は畳む(にーくらが 0 KB のトレースを24本の壁から拾わされた反省)。 */
function tankRecordsSetOpen(open){
  TANK_RECORDS_OPEN=open;
  const body=document.getElementById('recBody');
  const toggle=document.getElementById('recToggle');
  const caret=document.getElementById('recCaret');
  if(body) body.style.display=open?'block':'none';
  if(toggle) toggle.setAttribute('aria-expanded',String(open));
  if(caret) caret.textContent=open?'▾':'▸';
}

/* =============================================================================
   7-9. YSM アニメブラウザ (S6)
   -----------------------------------------------------------------------------
   **実機を起動せずに YSM アニメを見る。** 出どころは `/tlmsim animsweep` が録った
   ライブラリ = 実機レンダラの頂点。ysm.js の再構成は通らない。

   **録画窓は 1 アニメ 20 tick (=1秒) しかない**（`SimAnimSweep.DEFAULT_TICKS_PER_ANIM`）。
   長いアニメは頭 1 秒しか見られない —— そのことは画面に字で出す。黙って短く見せない。
   ============================================================================= */
const AB={ name:null, frame:0, frames:0, playing:false, timer:null };

// 遅れて届いた資産 (テクスチャ / アニメの頂点) で描き直す。**静止した絵は自分では直らない。**
if(window.SimGL&&SimGL.setAssetReadyHook) SimGL.setAssetReadyHook(()=>{
  if(typeof draw==='function') draw();
  if(AB.name) animRefresh();
});

function animSetOpen(open){
  const b=document.getElementById('animBody'), t=document.getElementById('animToggle'),
        c=document.getElementById('animCaret');
  if(b) b.style.display=open?'block':'none';
  if(t) t.setAttribute('aria-expanded',String(open));
  if(c) c.textContent=open?'▾':'▸';
  if(open) animBuildList();
}
function animBuildList(){
  const host=document.getElementById('animList'); if(!host) return;
  const all=(window.SimGL&&SimGL.animList)?SimGL.animList():[];
  const cnt=document.getElementById('animCount');
  if(!all.length){
    host.innerHTML='<div style="color:var(--ink-faint)">ライブラリが無い —— '
      +'<span class="num">/tlmsim animsweep</span> で全アニメを1回録ると、ここに並ぶ。</div>';
    if(cnt) cnt.textContent='';
    return;
  }
  if(cnt) cnt.textContent=all.length+' 本';
  const q=(document.getElementById('animFilter')||{}).value||'';
  const list=q?all.filter(a=>a.name.toLowerCase().includes(q.toLowerCase())):all;
  host.innerHTML=list.map(a=>{
    // **窓の外がどれだけあるかを1本ずつ出す。** 「全部見えている」と誤解させない。
    const covered=a.frames/20, cut=a.length>covered+0.01;
    const tail=cut?' <span style="color:#c8a04a">頭'+covered.toFixed(1)+'s/'+a.length.toFixed(1)+'s</span>'
                  :' <span style="color:var(--ink-faint)">'+a.frames+'f</span>';
    return '<div class="animRow" data-anim="'+a.name.replace(/"/g,'&quot;')+'" '
      +'style="cursor:pointer;padding:2px 4px;border-radius:3px'
      +(AB.name===a.name?';background:#26303f;color:#cfe0ff':'')+'">'
      +a.name.replace(/</g,'&lt;')+tail+'</div>';
  }).join('');
  for(const el of host.querySelectorAll('.animRow')){
    el.onclick=()=>animSelect(el.getAttribute('data-anim'));
  }
}
function animSelect(name){
  AB.name=name; AB.frame=0;
  const a=((window.SimGL&&SimGL.animList)?SimGL.animList():[]).find(x=>x.name===name);
  AB.frames=a?a.frames:20;
  const row=document.getElementById('animPlayRow'); if(row) row.style.display='flex';
  const sl=document.getElementById('animFrame'); if(sl){ sl.max=String(Math.max(0,AB.frames-1)); sl.value='0'; }
  SimGL.setAnimPreview(name,0);
  animBuildList(); animRefresh();
}
function animRefresh(){
  const n=document.getElementById('animFrameN');
  if(n) n.textContent=AB.name?(AB.frame+1)+'/'+AB.frames:'';
  const st=document.getElementById('animStatus');
  const p=(window.SimGL&&SimGL.animPreview)?SimGL.animPreview():null;
  if(st) st.textContent=AB.name
    ? (p&&p.status?p.status:'')+'（実機頂点。ysm.js の再構成は通っていない）'
    : 'アニメを選ぶと、実機を起動せずにその姿勢を見られる。';
  if(typeof draw==='function') draw();
}
function animSetFrame(k){
  if(!AB.name) return;
  AB.frame=Math.max(0,Math.min(AB.frames-1,k|0));
  const sl=document.getElementById('animFrame'); if(sl) sl.value=String(AB.frame);
  SimGL.setAnimPreview(AB.name,AB.frame);
  animRefresh();
}
function animSetPlaying(on){
  AB.playing=on;
  const b=document.getElementById('animPlay'); if(b) b.textContent=on?'❚❚':'▶';
  if(AB.timer){ clearInterval(AB.timer); AB.timer=null; }
  // 実機と同じ 20 tick/秒 で送る（録画がその刻みだから）。
  if(on) AB.timer=setInterval(()=>animSetFrame((AB.frame+1)%AB.frames),50);
}
/** 通常表示へ戻す。トレースを開いたときに呼ぶ —— 二つの絵が混ざらないように。 */
function animClear(){
  animSetPlaying(false); AB.name=null;
  if(window.SimGL&&SimGL.setAnimPreview) SimGL.setAnimPreview(null);
  const row=document.getElementById('animPlayRow'); if(row) row.style.display='none';
  animBuildList(); animRefresh();
}
document.addEventListener('click',(e)=>{
  const t=e.target.closest&&e.target.closest('#animToggle');
  if(t) animSetOpen(document.getElementById('animBody').style.display==='none');
});
document.addEventListener('input',(e)=>{
  if(e.target.id==='animFilter') animBuildList();
  else if(e.target.id==='animFrame') animSetFrame(Number(e.target.value));
});
document.addEventListener('click',(e)=>{
  if(e.target.id==='animPlay') animSetPlaying(!AB.playing);
});

/* =============================================================================
   8. 起動
   ============================================================================= */
(async function boot(){
  // 共有モジュールを先に読む。これが無いと系列も phase も出ない。
  await SHARED_READY;
  cacheCss();
  if(window.SimGL) SimGL.init(glCanvas);
  resize();
  // **水槽は常に水槽。** トレースを開かず、ライブにも繋がっていない最初の1枚から、
  // 空のチャンバー(グリッド/床/void)を描く(design point 1)。他の起動処理(status
  // 取得・記録一覧の fetch)を待たない —— 見えるものは一番早く出す。
  //
  // **空の水槽は「水槽そのもの」として構える。** 既定の cam(dist 34) は中のモブを
  // 見るための寄りで、誰もいない状態だと床が画面を埋めて奥の壁が切れ、何を見せられて
  // いるのか判らない絵になっていた(2026-08-21 に撮って確認)。半径24の器がちょうど
  // 収まる引きへ置き直す。トレースを開いた時とライブで誰か現れた時は、それぞれの
  // frameCam / cam.dist=15 が上書きするので、これが効くのは「誰もいない間」だけ。
  Object.assign(cam,{yaw:-0.62,pitch:0.66,dist:70,ty:68,tz:2});
  draw();
  document.getElementById('camGrp').style.opacity='1';
  if(location.protocol==='http:'||location.protocol==='https:'){
    T.served=true;
    try{
      // ---- 霊夢をスポーンさせる ----
      // にーくら 2026-08-20:「どうしてトレースを開かなきゃいけないの？
      //   1から空間に霊夢をスポーンさせればいいじゃん？」
      // そのとおりで、トレースは**裏で生まれて裏で開かれる**べきもの。
      // ここでシナリオを選んで押すと runSim が走り、終わったら自動でその結果が開く。
      // (Phase 12「サイクルを閉じる」の入口。走りながら見るのは Phase 12 本体でやる)
      await buildTankUi();

      // **放つモブの一覧は、水槽の生死と関係なく読める。**
      // entities.json は jar が前回の起動時に書いてディスクに残っているので、
      // 水槽が立っていなくても選べる —— 立つのを 1〜2 分待つ間、ドロップダウンが
      // 空のままだと「起動したのにスポーンできない」ことになる
      // (にーくら 2026-08-22 の指摘)。これまで tankSyncLive() の live 分岐でしか
      // 呼んでいなかったのが誤りで、一覧の取得は水槽の状態に紐づく仕事ではない。
      // 立つ前に選んでおける方が、立った瞬間に放てて手数も減る。
      loadTankEntities();

      const r=await fetch('/api/traces'); const list=await r.json();
      renderRecords(list);
    }catch{}
    const q=new URLSearchParams(location.search).get('trace');
    if(q){ try{ const t=await (await fetch('/api/trace?path='+encodeURIComponent(q))).text(); load(t,q); }catch{} }
  }
})();
</script>
