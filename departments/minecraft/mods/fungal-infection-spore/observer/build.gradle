plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'org.kneekura.research'
version = '0.1.0-research'
base { archivesName = 'kneekura-spore-observer' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            args '--nogui'
            mods { kneekura_spore_observer { source sourceSets.main } }
        }
    }
}

dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.10' }

tasks.named('processResources', ProcessResources).configure {
    inputs.property('observer_version', project.version)
    filesMatching('META-INF/mods.toml') { expand(observer_version: project.version) }
}
