plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def gameTestRunDirectory = project.file('run-gametest')
def flightTestModsDirectory = project.file('flight-test-mods')
def generatedGameTestResources = layout.buildDirectory.dir('generated/gametest-resources')
sourceSets.main.resources.srcDir(generatedGameTestResources)
// Compile the very same, dependency-free decision code exercised by the headless tests.
// Do not duplicate or rewrite the pure-Java policies in this Forge adapter.
sourceSets.main.java.srcDir(project.file('../src/main/java'))
def generatedTacticalAtlas = layout.buildDirectory.dir('generated/tactical-atlas')
sourceSets.main.resources.srcDir(generatedTacticalAtlas)

tasks.register('stageRuntimeTacticalAtlas', Copy) {
    from project.file('../data/base-aircraft-anchor-v1.csv')
    into generatedTacticalAtlas
    rename { 'ww-tactical-anchor-v1.csv' }
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                ww_physics_trace_probe {
                    source sourceSets.main
                }
            }
        }
        gameTestServer {
            workingDirectory gameTestRunDirectory
            property 'forge.enabledGameTestNamespaces', mod_id
        }
    }
}

repositories {
    mavenCentral()
    flatDir { dirs flightTestModsDirectory }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    if (flightTestModsDirectory.toPath().resolve('immersive_aircraft-1.3.3+1.20.1-forge.jar').toFile().isFile()) {
        implementation fg.deobf('wwtrace:immersive_aircraft:1.3.3+1.20.1-forge')
    }
    if (flightTestModsDirectory.toPath().resolve('warfare_wings-1.1.4-1.20.1-forge.jar').toFile().isFile()) {
        implementation fg.deobf('wwtrace:warfare_wings:1.1.4-1.20.1-forge')
    }
}

tasks.register('generateEmptyGameTestStructure') {
    def output = generatedGameTestResources.map {
        it.file("data/${mod_id}/structures/empty.nbt").asFile
    }
    outputs.file(output)
    doLast {
        File target = output.get()
        target.parentFile.mkdirs()
        new java.io.DataOutputStream(new java.util.zip.GZIPOutputStream(
                new java.io.BufferedOutputStream(new java.io.FileOutputStream(target)))).withCloseable { out ->
            out.writeByte(10); out.writeUTF('')
            out.writeByte(3); out.writeUTF('DataVersion'); out.writeInt(3465)
            out.writeByte(9); out.writeUTF('size'); out.writeByte(3); out.writeInt(3)
            out.writeInt(1); out.writeInt(1); out.writeInt(1)
            out.writeByte(9); out.writeUTF('palette'); out.writeByte(10); out.writeInt(1)
            out.writeByte(8); out.writeUTF('Name'); out.writeUTF('minecraft:air'); out.writeByte(0)
            out.writeByte(9); out.writeUTF('blocks'); out.writeByte(10); out.writeInt(0)
            out.writeByte(9); out.writeUTF('entities'); out.writeByte(10); out.writeInt(0)
            out.writeByte(0)
        }
    }
}

tasks.register('prepareRuntimeTrace') {
    group = 'verification'
    dependsOn tasks.named('generateEmptyGameTestStructure')
    dependsOn tasks.named('verifyPinnedRuntimeJars')
    doLast {
        gameTestRunDirectory.mkdirs()
        new File(gameTestRunDirectory, 'eula.txt').text = 'eula=true\n'
        File ia = new File(flightTestModsDirectory, 'immersive_aircraft-1.3.3+1.20.1-forge.jar')
        File ww = new File(flightTestModsDirectory, 'warfare_wings-1.1.4-1.20.1-forge.jar')
        if (!ia.isFile() || !ww.isFile()) {
            throw new GradleException('Exact runtime jars must be staged in runtime-probe/flight-test-mods.')
        }
        project.delete(new File(gameTestRunDirectory, 'mods'))
    }
}

// The workflow also checks these artifacts before staging, but a direct local
// runGameTestServer must observe the identical immutable provenance gate.
tasks.register('verifyPinnedRuntimeJars') {
    group = 'verification'
    description = 'Reject any local runtime artifact other than the exact researched binaries'
    doLast {
        def expected = [
                ['warfare_wings-1.1.4-1.20.1-forge.jar', 'SHA-256',
                 'dc3029597c88859744633b6f5e4a9f21d449294b1aaac90ea0c1749d7aa98a43'],
                ['immersive_aircraft-1.3.3+1.20.1-forge.jar', 'SHA-512',
                 '7b74442e161bb74538e0d8da34a81616daeea56a0da62db86113a78b3bf3c2b3a6b0e12f12454fd7c96092762f6b212ba57cb87eb1af2b242a4d5df4eca03055']
        ]
        expected.each { entry ->
            File file = new File(flightTestModsDirectory, entry[0])
            if (!file.isFile()) throw new GradleException("Pinned runtime dependency absent: ${entry[0]}")
            def digester = java.security.MessageDigest.getInstance(entry[1])
            file.withInputStream { stream ->
                byte[] buffer = new byte[65536]
                int count
                while ((count = stream.read(buffer)) != -1) digester.update(buffer, 0, count)
            }
            String actual = digester.digest().encodeHex().toString()
            if (!actual.equalsIgnoreCase(entry[2]))
                throw new GradleException("Pinned runtime dependency hash mismatch: ${entry[0]} expected=${entry[2]} actual=${actual}")
            logger.lifecycle("PINNED_RUNTIME_HASH_OK ${entry[0]} ${entry[1]} ${actual}")
        }
    }
}

tasks.register('verifyTacticalInputCorrection', JavaExec) {
    group = 'verification'
    description = 'Source-only IA 10-step input smoothing and one-tick pilot-lag contract'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.kneekura.techhub.warfarewings.trace.IaNonPlayerInputBridgeMath'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn tasks.named('generateEmptyGameTestStructure')
    dependsOn tasks.named('stageRuntimeTacticalAtlas')
    def replaceProperties = [
            minecraft_version: minecraft_version,
            forge_version: forge_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_version: mod_version
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn tasks.named('prepareRuntimeTrace')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
