plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def gameTestRunDirectory = project.file('run-gametest')
def flightTestModsDirectory = project.file('flight-test-mods')
def generatedGameTestResources = layout.buildDirectory.dir('generated/gametest-resources')
sourceSets.main.resources.srcDir(generatedGameTestResources)

minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                ww_physics_trace_probe {
                    source sourceSets.main
                }
            }
        }
        gameTestServer {
            workingDirectory gameTestRunDirectory
            property 'forge.enabledGameTestNamespaces', mod_id
        }
    }
}

repositories {
    mavenCentral()
    flatDir { dirs flightTestModsDirectory }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    if (flightTestModsDirectory.toPath().resolve('immersive_aircraft-1.3.3+1.20.1-forge.jar').toFile().isFile()) {
        implementation fg.deobf('wwtrace:immersive_aircraft:1.3.3+1.20.1-forge')
    }
    if (flightTestModsDirectory.toPath().resolve('warfare_wings-1.1.4-1.20.1-forge.jar').toFile().isFile()) {
        implementation fg.deobf('wwtrace:warfare_wings:1.1.4-1.20.1-forge')
    }
}

tasks.register('generateEmptyGameTestStructure') {
    def output = generatedGameTestResources.map {
        it.file("data/${mod_id}/structures/empty.nbt").asFile
    }
    outputs.file(output)
    doLast {
        File target = output.get()
        target.parentFile.mkdirs()
        new java.io.DataOutputStream(new java.util.zip.GZIPOutputStream(
                new java.io.BufferedOutputStream(new java.io.FileOutputStream(target)))).withCloseable { out ->
            out.writeByte(10); out.writeUTF('')
            out.writeByte(3); out.writeUTF('DataVersion'); out.writeInt(3465)
            out.writeByte(9); out.writeUTF('size'); out.writeByte(3); out.writeInt(3)
            out.writeInt(1); out.writeInt(1); out.writeInt(1)
            out.writeByte(9); out.writeUTF('palette'); out.writeByte(10); out.writeInt(1)
            out.writeByte(8); out.writeUTF('Name'); out.writeUTF('minecraft:air'); out.writeByte(0)
            out.writeByte(9); out.writeUTF('blocks'); out.writeByte(10); out.writeInt(0)
            out.writeByte(9); out.writeUTF('entities'); out.writeByte(10); out.writeInt(0)
            out.writeByte(0)
        }
    }
}

tasks.register('prepareRuntimeTrace') {
    group = 'verification'
    dependsOn tasks.named('generateEmptyGameTestStructure')
    doLast {
        gameTestRunDirectory.mkdirs()
        new File(gameTestRunDirectory, 'eula.txt').text = 'eula=true\n'
        File ia = new File(flightTestModsDirectory, 'immersive_aircraft-1.3.3+1.20.1-forge.jar')
        File ww = new File(flightTestModsDirectory, 'warfare_wings-1.1.4-1.20.1-forge.jar')
        if (!ia.isFile() || !ww.isFile()) {
            throw new GradleException('Exact runtime jars must be staged in runtime-probe/flight-test-mods.')
        }
        project.delete(new File(gameTestRunDirectory, 'mods'))
    }
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn tasks.named('generateEmptyGameTestStructure')
    def replaceProperties = [
            minecraft_version: minecraft_version,
            forge_version: forge_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_version: mod_version
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn tasks.named('prepareRuntimeTrace')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}