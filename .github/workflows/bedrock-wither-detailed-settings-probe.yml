name: Bedrock Wither Detailed Settings Probe

on:
  push:
    branches:
      - codex/bedrock-wither-lifecycle-regressions-2026-10-03
    paths:
      - '.github/workflows/bedrock-wither-detailed-settings-probe.yml'
      - '.github/bedrock-wither-detailed-settings-probe-request.txt'

permissions:
  contents: read

concurrency:
  group: bedrock-wither-detailed-settings-probe
  cancel-in-progress: false

jobs:
  detailed-settings-probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    defaults:
      run:
        shell: powershell

    steps:
      - name: Seek Detailed Settings by keyboard focus and open
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:GITHUB_WORKSPACE 'bedrock-detailed-settings-probe'
          if(Test-Path $out){Remove-Item $out -Recurse -Force}
          New-Item -ItemType Directory -Path $out | Out-Null

          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class Win32DetailedBwr {
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int X,int Y);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            [DllImport("user32.dll",CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr hWnd,System.Text.StringBuilder text,int count);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hWnd,int command);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr hWnd,IntPtr processId);
            [DllImport("user32.dll")] public static extern bool AttachThreadInput(uint a,uint b,bool attach);
            [DllImport("user32.dll")] public static extern bool BringWindowToTop(IntPtr hWnd);
            [DllImport("kernel32.dll")] public static extern uint GetCurrentThreadId();
          }
          '@
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms

          function Capture([string]$path){
            $s=[System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp=New-Object System.Drawing.Bitmap $s.Width,$s.Height
            $g=[System.Drawing.Graphics]::FromImage($bmp)
            try{$g.CopyFromScreen($s.Left,$s.Top,0,0,$s.Size);$bmp.Save($path,[System.Drawing.Imaging.ImageFormat]::Png)}
            finally{$g.Dispose();$bmp.Dispose()}
          }
          function Get-ForegroundTitle{
            $h=[Win32DetailedBwr]::GetForegroundWindow()
            $sb=New-Object System.Text.StringBuilder 512
            [void][Win32DetailedBwr]::GetWindowText($h,$sb,$sb.Capacity)
            return $sb.ToString()
          }
          function Test-DetailedFocus([string]$path){
            $bmp=[System.Drawing.Bitmap]::FromFile($path)
            try{
              $top=$bmp.GetPixel(300,505)
              $right=$bmp.GetPixel(605,570)
              $bottom=$bmp.GetPixel(300,632)
              $center=$bmp.GetPixel(300,570)
              $white=(
                $top.R -ge 245 -and $top.G -ge 245 -and $top.B -ge 245 -and
                $right.R -ge 240 -and $right.G -ge 240 -and $right.B -ge 240 -and
                $bottom.R -ge 245 -and $bottom.G -ge 245 -and $bottom.B -ge 245
              )
              $dark=($center.R -ge 35 -and $center.R -le 65 -and
                     $center.G -ge 35 -and $center.G -le 65 -and
                     $center.B -ge 35 -and $center.B -le 65)
              return ($white -and $dark)
            }finally{$bmp.Dispose()}
          }

          $sid=(Get-Process -Id $PID).SessionId
          $p=Get-Process -ErrorAction SilentlyContinue |
            Where-Object{$_.SessionId -eq $sid -and $_.MainWindowHandle -ne 0 -and $_.MainWindowTitle -eq 'Minecraft'} |
            Select-Object -First 1
          if($null -eq $p){throw 'Minecraft settings window absent'}

          $fg=[Win32DetailedBwr]::GetForegroundWindow()
          $cur=[Win32DetailedBwr]::GetCurrentThreadId()
          $fgT=[Win32DetailedBwr]::GetWindowThreadProcessId($fg,[IntPtr]::Zero)
          $targetT=[Win32DetailedBwr]::GetWindowThreadProcessId($p.MainWindowHandle,[IntPtr]::Zero)
          if($fgT -ne 0){[Win32DetailedBwr]::AttachThreadInput($cur,$fgT,$true)|Out-Null}
          if($targetT -ne 0 -and $targetT -ne $cur){[Win32DetailedBwr]::AttachThreadInput($cur,$targetT,$true)|Out-Null}
          try{
            [Win32DetailedBwr]::ShowWindow($p.MainWindowHandle,9)|Out-Null
            [Win32DetailedBwr]::BringWindowToTop($p.MainWindowHandle)|Out-Null
            [Win32DetailedBwr]::SetForegroundWindow($p.MainWindowHandle)|Out-Null
          }finally{
            if($targetT -ne 0 -and $targetT -ne $cur){[Win32DetailedBwr]::AttachThreadInput($cur,$targetT,$false)|Out-Null}
            if($fgT -ne 0){[Win32DetailedBwr]::AttachThreadInput($cur,$fgT,$false)|Out-Null}
          }

          Start-Sleep -Seconds 1
          if((Get-ForegroundTitle) -ne 'Minecraft'){throw 'Foreground verification failed'}
          [Win32DetailedBwr]::SetCursorPos(10,10)|Out-Null
          Start-Sleep -Milliseconds 500

          $shell=New-Object -ComObject WScript.Shell
          $probe=Join-Path $out 'detailed-focused.png'
          $found=$false
          $tabs=0
          for($i=0;$i -lt 32;$i++){
            Capture $probe
            if(Test-DetailedFocus $probe){$found=$true;break}
            [void]$shell.SendKeys('{TAB}')
            $tabs++
            Start-Sleep -Milliseconds 450
          }
          if(-not $found){throw 'Detailed Settings focus fingerprint not found within bounded Tab search'}

          [void]$shell.SendKeys('{ENTER}')
          Start-Sleep -Seconds 3
          Capture (Join-Path $out 'detailed-settings-screen.png')

          Write-Host ('BWR_DETAILED_SETTINGS_JSON=' + ([ordered]@{
            focus_verified=$true
            tab_count=$tabs
            enter_sent=$true
            settings_changed=$false
            world_created=$false
          } | ConvertTo-Json -Compress))

      - name: Upload Detailed Settings probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bedrock-wither-detailed-settings-probe
          retention-days: 3
          if-no-files-found: warn
          path: bedrock-detailed-settings-probe/*.png
