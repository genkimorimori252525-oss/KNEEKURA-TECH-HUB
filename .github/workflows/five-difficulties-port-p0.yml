name: Five Difficulties Port P5

on:
  push:
    branches: ["jolly/five-difficulties-1201-port-p5-2026-10-07"]
    paths:
      - 'departments/minecraft/mods/five-difficulties/port-1.20.1/**'
      - '.github/workflows/five-difficulties-port-p0.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: five-difficulties-p5-${{ github.sha }}
  cancel-in-progress: true

jobs:
  p5:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run pure Java preservation-core regressions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x departments/minecraft/mods/five-difficulties/port-1.20.1/tools/run-pure-core-tests.sh
          departments/minecraft/mods/five-difficulties/port-1.20.1/tools/run-pure-core-tests.sh | tee pure-core.txt

      - name: Validate resource JSON
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool departments/minecraft/mods/five-difficulties/port-1.20.1/src/main/resources/assets/five_difficulties_port/lang/en_us.json >/dev/null
          python -m json.tool departments/minecraft/mods/five-difficulties/port-1.20.1/src/main/resources/assets/five_difficulties_port/lang/ja_jp.json >/dev/null

      - name: Prepare exact Forge 1.20.1 reference MDK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/five-difficulties-mdk"
          mkdir -p "$ROOT" forge-evidence
          curl --fail --location --retry 2 --max-time 120 \
            https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.6/forge-1.20.1-47.4.6-mdk.zip \
            -o "$RUNNER_TEMP/five-difficulties-mdk.zip"
          echo "1a1c045f235262ff617e285ea2156571ea93bfbe  $RUNNER_TEMP/five-difficulties-mdk.zip" | sha1sum --check
          unzip -q "$RUNNER_TEMP/five-difficulties-mdk.zip" -d "$ROOT"
          rm -rf "$ROOT/src"
          cp -R departments/minecraft/mods/five-difficulties/port-1.20.1/src "$ROOT/src"
          python departments/minecraft/mods/five-difficulties/port-1.20.1/tools/patch-mdk-mixins.py "$ROOT/build.gradle"
          sed -i 's/^mod_id=.*/mod_id=five_difficulties_port/' "$ROOT/gradle.properties"
          sed -i 's/^mod_name=.*/mod_name=Five Difficulties X1 Preservation Port/' "$ROOT/gradle.properties"
          sed -i 's/^mod_version=.*/mod_version=0.0.6-p5/' "$ROOT/gradle.properties"
          sed -i 's/^mod_group_id=.*/mod_group_id=dev.kneekura.fivedifficulties/' "$ROOT/gradle.properties"
          sed -i 's/^mod_authors=.*/mod_authors=KNEEKURA private preservation project/' "$ROOT/gradle.properties"
          sed -i 's/^mod_license=.*/mod_license=All Rights Reserved/' "$ROOT/gradle.properties"
          sha1sum "$RUNNER_TEMP/five-difficulties-mdk.zip" > forge-evidence/mdk-sha1.txt
          find departments/minecraft/mods/five-difficulties/port-1.20.1/src -type f -print0 | sort -z | xargs -0 sha256sum > forge-evidence/source-inputs.sha256

      - name: Compile and package against Forge 47.4.6
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/five-difficulties-mdk"
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3G compileJava jar 2>&1 | tee "$GITHUB_WORKSPACE/forge-evidence/compile.txt"
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' | sort | head -n 1)"
          test -n "$JAR"
          sha256sum "$JAR" > "$GITHUB_WORKSPACE/forge-evidence/jar.sha256"
          unzip -p "$JAR" META-INF/MANIFEST.MF | tee "$GITHUB_WORKSPACE/forge-evidence/manifest.txt"
          grep -F "MixinConfigs: five_difficulties_port.mixins.json" "$GITHUB_WORKSPACE/forge-evidence/manifest.txt"
          unzip -l "$JAR" | tee "$GITHUB_WORKSPACE/forge-evidence/jar-contents.txt"
          grep -F "five_difficulties_port.mixins.json" "$GITHUB_WORKSPACE/forge-evidence/jar-contents.txt"
          grep -F "five_difficulties_port.refmap.json" "$GITHUB_WORKSPACE/forge-evidence/jar-contents.txt"

      - name: Bounded dedicated-server runtime smoke
        shell: bash
        env:
          FIVE_DIFFICULTIES_RUNTIME_SMOKE_EXIT: "1"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/five-difficulties-mdk"
          mkdir -p run "$GITHUB_WORKSPACE/forge-evidence"
          printf 'eula=true\n' > run/eula.txt
          cat > run/server.properties <<'EOF'
          online-mode=false
          server-port=25575
          level-name=p5_smoke
          level-type=minecraft:flat
          generate-structures=false
          spawn-protection=0
          max-players=1
          view-distance=2
          simulation-distance=2
          motd=Five Difficulties P5 Runtime Smoke
          EOF

          set +e
          timeout --signal=INT --kill-after=10s 120s \
            ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3G runServer --args='nogui' \
            2>&1 | tee "$GITHUB_WORKSPACE/forge-evidence/runtime-server.txt"
          RUN_RC=${PIPESTATUS[0]}
          set -e

          cp -f run/logs/latest.log "$GITHUB_WORKSPACE/forge-evidence/runtime-latest.log" 2>/dev/null || true

          grep -F "FIVE_DIFFICULTIES_P5_RUNTIME_SMOKE_PASS" "$GITHUB_WORKSPACE/forge-evidence/runtime-server.txt"
          grep -F "Done (" "$GITHUB_WORKSPACE/forge-evidence/runtime-server.txt"
          ! grep -F "Failed to start the minecraft server" "$GITHUB_WORKSPACE/forge-evidence/runtime-server.txt"
          ! grep -F "Crash report saved to" "$GITHUB_WORKSPACE/forge-evidence/runtime-server.txt"

          case "$RUN_RC" in
            0|124|130|143) ;;
            *)
              echo "Unexpected runServer exit code: $RUN_RC" >&2
              exit "$RUN_RC"
              ;;
          esac

          echo "P5_DEDICATED_SERVER_RUNTIME_PASS" | tee "$GITHUB_WORKSPACE/forge-evidence/runtime-verdict.txt"

      - name: Retain bounded compile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-difficulties-p5-${{ github.sha }}
          path: |
            pure-core.txt
            forge-evidence/
          retention-days: 7
