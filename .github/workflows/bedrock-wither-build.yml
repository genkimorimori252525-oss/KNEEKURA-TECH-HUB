name: Bedrock Wither build

on:
  push:
    branches:
      - jolly/bedrock-wither-reconstruction-2026-10-02
    paths:
      - 'deliverables/minecraft/bedrock-wither/mod/**'
      - '.github/workflows/bedrock-wither-build.yml'
  pull_request:
    paths:
      - 'deliverables/minecraft/bedrock-wither/mod/**'
      - '.github/workflows/bedrock-wither-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deliverables/minecraft/bedrock-wither/mod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Build standalone MOD scaffold
        run: gradle build --stacktrace --no-daemon
