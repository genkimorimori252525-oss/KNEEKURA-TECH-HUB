name: Warfare Wings Physics AI Runtime Trace

on:
  workflow_dispatch:
    inputs:
      warfare_wings_path:
        description: 'Optional absolute local path to the user-owned supplied Warfare Wings ANCHOR JAR'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: warfare-wings-physics-ai-runtime
  cancel-in-progress: false

jobs:
  a6m-throttle-trace:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@v4
        with:
          ref: jolly/research-warfare-wings-2026-10-07
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Stage exact runtime jars
        env:
          INPUT_WW_PATH: ${{ inputs.warfare_wings_path }}
          EXPECTED_WW_SHA256: dc3029597c88859744633b6f5e4a9f21d449294b1aaac90ea0c1749d7aa98a43
          EXPECTED_IA_SHA512: 7b74442e161bb74538e0d8da34a81616daeea56a0da62db86113a78b3bf3c2b3a6b0e12f12454fd7c96092762f6b212ba57cb87eb1af2b242a4d5df4eca03055
        run: |
          $probe = Join-Path $env:GITHUB_WORKSPACE 'departments/minecraft/mods/warfare-wings/physics-ai/runtime-probe'
          $mods = Join-Path $probe 'flight-test-mods'
          New-Item -ItemType Directory -Force $mods | Out-Null

          $candidates = @()
          if ($env:INPUT_WW_PATH) { $candidates += $env:INPUT_WW_PATH }
          if ($env:KNEEKURA_WW_ANCHOR_JAR) { $candidates += $env:KNEEKURA_WW_ANCHOR_JAR }
          $candidates += (Join-Path $HOME 'Downloads/warfare_wings-1.1.4-1.20.1-forge.jar')
          $candidates += (Join-Path $HOME 'Documents/warfare_wings-1.1.4-1.20.1-forge.jar')

          $source = $null
          foreach ($candidate in $candidates | Select-Object -Unique) {
            if (-not $candidate -or -not (Test-Path -LiteralPath $candidate -PathType Leaf)) { continue }
            $hash = (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -eq $env:EXPECTED_WW_SHA256) {
              $source = (Resolve-Path -LiteralPath $candidate).Path
              break
            }
          }
          if (-not $source) {
            throw "Exact user-owned Warfare Wings ANCHOR not found. No public-artifact fallback is allowed. Expected SHA-256=$env:EXPECTED_WW_SHA256"
          }
          Copy-Item -LiteralPath $source -Destination (Join-Path $mods 'warfare_wings-1.1.4-1.20.1-forge.jar') -Force

          $env:WW_TRACE_MODS_DIR = $mods
          @'
          import json
          import os
          import pathlib
          import urllib.request

          version_id = "GsVmbbkj"
          target = pathlib.Path(os.environ["WW_TRACE_MODS_DIR"]) / "immersive_aircraft-1.3.3+1.20.1-forge.jar"
          request = urllib.request.Request(
              f"https://api.modrinth.com/v2/version/{version_id}",
              headers={"User-Agent":"KNEEKURA-TechHub-PhysicsTrace/1.0"})
          with urllib.request.urlopen(request) as response:
              metadata = json.load(response)
          selected = next((x for x in metadata["files"] if x.get("primary")), metadata["files"][0])
          download = urllib.request.Request(
              selected["url"],
              headers={"User-Agent":"KNEEKURA-TechHub-PhysicsTrace/1.0"})
          with urllib.request.urlopen(download) as response:
              target.write_bytes(response.read())
          print(target)
          '@ | python -

          $ww = Join-Path $mods 'warfare_wings-1.1.4-1.20.1-forge.jar'
          $ia = Join-Path $mods 'immersive_aircraft-1.3.3+1.20.1-forge.jar'
          if ((Get-FileHash $ww -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:EXPECTED_WW_SHA256) { throw 'Warfare Wings hash drift' }
          if ((Get-FileHash $ia -Algorithm SHA512).Hash.ToLowerInvariant() -ne $env:EXPECTED_IA_SHA512) { throw 'Immersive Aircraft hash drift' }
          Write-Host "Exact runtime jars verified."

      - name: Run exact A6M throttle GameTest
        working-directory: departments/minecraft/mods/warfare-wings/physics-ai/runtime-probe
        run: gradle --no-daemon --console=plain runGameTestServer

      - name: Verify trace receipt
        working-directory: departments/minecraft/mods/warfare-wings/physics-ai/runtime-probe
        run: |
          $trace = 'run-gametest/ww-physics-traces/a6m-throttle-step-v1-runtime.csv'
          if (-not (Test-Path $trace)) { throw "Missing runtime trace: $trace" }
          $lines = Get-Content $trace
          if ($lines.Count -ne 402) { throw "Expected header + 401 samples, got $($lines.Count)" }
          if (-not $lines[0].StartsWith('schema_version,source,scenario_id,aircraft_id,tick,game_time,')) { throw 'Trace schema mismatch' }
          Write-Host "Runtime trace rows verified: 401"

      - name: Generate matching microkernel trace and calibration report
        working-directory: departments/minecraft/mods/warfare-wings/physics-ai/runtime-probe
        run: |
          $classes = 'build/trace-classes'
          New-Item -ItemType Directory -Force $classes | Out-Null
          $src = '../src/main/java/org/kneekura/techhub/warfarewings/physics'
          $sources = @(
            "$src/Ia133Microkernel.java",
            "$src/WarfareWingsAircraft.java",
            "$src/TraceCsv.java",
            "$src/TraceScenarioMain.java"
          )
          javac --release 17 -d $classes $sources
          if ($LASTEXITCODE -ne 0) { throw "Microkernel trace compilation failed: $LASTEXITCODE" }

          $traceDir = 'run-gametest/ww-physics-traces'
          $micro = "$traceDir/a6m-throttle-step-v1-microkernel.csv"
          $runtime = "$traceDir/a6m-throttle-step-v1-runtime.csv"
          java -cp $classes org.kneekura.techhub.warfarewings.physics.TraceScenarioMain $micro
          if ($LASTEXITCODE -ne 0) { throw "Microkernel trace generation failed: $LASTEXITCODE" }

          $metadataPath = "$traceDir/runtime-metadata.json"
          [ordered]@{
            schema_version = 'ww.physics.runtime-metadata.v1'
            scenario_id = 'a6m-throttle-step-v1'
            aircraft_id = 'warfare_wings:a6m'
            github_run_id = [long]$env:GITHUB_RUN_ID
            github_sha = $env:GITHUB_SHA
            runner_name = $env:RUNNER_NAME
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            minecraft_version = '1.20.1'
            forge_version = '47.4.20'
            immersive_aircraft_modrinth_version = 'GsVmbbkj'
            immersive_aircraft_sha512 = '7b74442e161bb74538e0d8da34a81616daeea56a0da62db86113a78b3bf3c2b3a6b0e12f12454fd7c96092762f6b212ba57cb87eb1af2b242a4d5df4eca03055'
            warfare_wings_sha256 = 'dc3029597c88859744633b6f5e4a9f21d449294b1aaac90ea0c1749d7aa98a43'
            warfare_wings_source = 'local-user-owned-hash-verified'
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding UTF8 $metadataPath

          python ../tools/compare_traces.py --microkernel $micro --runtime $runtime --runtime-metadata $metadataPath --output-dir "$traceDir/calibration"
          if ($LASTEXITCODE -ne 0) { throw "Trace comparison failed: $LASTEXITCODE" }

      - name: Upload runtime trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warfare-wings-a6m-throttle-runtime-trace
          retention-days: 14
          if-no-files-found: warn
          path: |
            departments/minecraft/mods/warfare-wings/physics-ai/runtime-probe/run-gametest/ww-physics-traces/**
            departments/minecraft/mods/warfare-wings/physics-ai/runtime-probe/run-gametest/logs/**
