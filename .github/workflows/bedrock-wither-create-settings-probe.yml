name: Bedrock Wither Create Settings Probe

on:
  push:
    branches:
      - codex/bedrock-wither-lifecycle-regressions-2026-10-03
    paths:
      - '.github/workflows/bedrock-wither-create-settings-probe.yml'
      - '.github/bedrock-wither-create-settings-probe-request.txt'

permissions:
  contents: read

concurrency:
  group: bedrock-wither-create-settings-probe
  cancel-in-progress: false

jobs:
  create-settings-probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    defaults:
      run:
        shell: powershell

    steps:
      - name: Focus Create New World safely and enter settings
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'bedrock-create-settings-probe'
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          New-Item -ItemType Directory -Path $out | Out-Null

          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class Win32CreateSettingsBwr {
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int X, int Y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint flags, uint dx, uint dy, uint data, UIntPtr extra);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetWindowText(IntPtr hWnd, System.Text.StringBuilder text, int count);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hWnd, int command);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr hWnd, IntPtr processId);
            [DllImport("user32.dll")] public static extern bool AttachThreadInput(uint idAttach, uint idAttachTo, bool attach);
            [DllImport("user32.dll")] public static extern bool BringWindowToTop(IntPtr hWnd);
            [DllImport("kernel32.dll")] public static extern uint GetCurrentThreadId();
            public const uint LEFTDOWN = 0x0002;
            public const uint LEFTUP = 0x0004;
          }
          '@
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms

          function Get-ForegroundTitle {
            $h=[Win32CreateSettingsBwr]::GetForegroundWindow()
            $sb=New-Object System.Text.StringBuilder 512
            [void][Win32CreateSettingsBwr]::GetWindowText($h,$sb,$sb.Capacity)
            return $sb.ToString()
          }

          function Capture([string]$path) {
            $screen=[System.Windows.Forms.SystemInformation]::VirtualScreen
            if ($screen.Width -ne 1536 -or $screen.Height -ne 864) {
              throw "Unexpected screen size $($screen.Width)x$($screen.Height); refusing UI navigation"
            }
            $bmp=New-Object System.Drawing.Bitmap $screen.Width,$screen.Height
            $g=[System.Drawing.Graphics]::FromImage($bmp)
            try {
              $g.CopyFromScreen($screen.Left,$screen.Top,0,0,$screen.Size)
              $bmp.Save($path,[System.Drawing.Imaging.ImageFormat]::Png)
            } finally { $g.Dispose(); $bmp.Dispose() }
          }

          $sessionId=(Get-Process -Id $PID).SessionId
          $windowProcess=Get-Process -ErrorAction SilentlyContinue |
            Where-Object { $_.SessionId -eq $sessionId -and $_.MainWindowHandle -ne 0 -and $_.MainWindowTitle -eq 'Minecraft' } |
            Select-Object -First 1
          if ($null -eq $windowProcess) {
            throw 'Minecraft window is absent; refusing to launch into an unknown navigation state'
          }

          $fg=[Win32CreateSettingsBwr]::GetForegroundWindow()
          $cur=[Win32CreateSettingsBwr]::GetCurrentThreadId()
          $fgThread=[Win32CreateSettingsBwr]::GetWindowThreadProcessId($fg,[IntPtr]::Zero)
          $targetThread=[Win32CreateSettingsBwr]::GetWindowThreadProcessId($windowProcess.MainWindowHandle,[IntPtr]::Zero)

          if ($fgThread -ne 0) { [Win32CreateSettingsBwr]::AttachThreadInput($cur,$fgThread,$true) | Out-Null }
          if ($targetThread -ne 0 -and $targetThread -ne $cur) { [Win32CreateSettingsBwr]::AttachThreadInput($cur,$targetThread,$true) | Out-Null }
          try {
            [Win32CreateSettingsBwr]::ShowWindow($windowProcess.MainWindowHandle,9) | Out-Null
            [Win32CreateSettingsBwr]::BringWindowToTop($windowProcess.MainWindowHandle) | Out-Null
            [Win32CreateSettingsBwr]::SetForegroundWindow($windowProcess.MainWindowHandle) | Out-Null
          } finally {
            if ($targetThread -ne 0 -and $targetThread -ne $cur) { [Win32CreateSettingsBwr]::AttachThreadInput($cur,$targetThread,$false) | Out-Null }
            if ($fgThread -ne 0) { [Win32CreateSettingsBwr]::AttachThreadInput($cur,$fgThread,$false) | Out-Null }
          }

          Start-Sleep -Seconds 1
          if ((Get-ForegroundTitle) -ne 'Minecraft') { throw 'Minecraft foreground verification failed' }

          # Move the mouse away so hover cannot masquerade as keyboard focus.
          [Win32CreateSettingsBwr]::SetCursorPos(10,10) | Out-Null
          Start-Sleep -Seconds 1

          $shell=New-Object -ComObject WScript.Shell

          function Test-WorldsTabFocus([string]$imagePath) {
            $bmp=[System.Drawing.Bitmap]::FromFile($imagePath)
            try {
              # Measured from reverse-focus evidence shift-tab10.png.
              $top=$bmp.GetPixel(350,129)
              $right=$bmp.GetPixel(662,190)
              $bottom=$bmp.GetPixel(350,258)
              $center=$bmp.GetPixel(350,190)

              $white3=(
                $top.R -ge 245 -and $top.G -ge 245 -and $top.B -ge 245 -and
                $right.R -ge 245 -and $right.G -ge 245 -and $right.B -ge 245 -and
                $bottom.R -ge 245 -and $bottom.G -ge 245 -and $bottom.B -ge 245
              )
              $centerGray=([Math]::Abs([int]$center.R-[int]$center.G) -le 8 -and
                           [Math]::Abs([int]$center.G-[int]$center.B) -le 8 -and
                           $center.R -ge 55 -and $center.R -le 95)
              return ($white3 -and $centerGray)
            } finally { $bmp.Dispose() }
          }

          function Test-WorldsScreen([string]$imagePath) {
            $bmp=[System.Drawing.Bitmap]::FromFile($imagePath)
            try {
              # Worlds screen has the green Create New World button at this
              # measured center; the Realms screen does not.
              $p=$bmp.GetPixel(835,333)
              return ($p.G -ge 100 -and $p.G -gt ($p.R + 35) -and $p.G -gt ($p.B + 35))
            } finally { $bmp.Dispose() }
          }

          $worldsFocusPath=Join-Path $out 'worlds-tab-focused.png'
          $worldsFound=$false
          $reverseTabCount=0
          for ($i=0; $i -lt 18; $i++) {
            Capture $worldsFocusPath
            if (Test-WorldsTabFocus $worldsFocusPath) {
              $worldsFound=$true
              break
            }
            [void]$shell.SendKeys('+{TAB}')
            $reverseTabCount++
            Start-Sleep -Milliseconds 650
          }
          if (-not $worldsFound) {
            throw 'Worlds tab keyboard-focus fingerprint was not found within 18 bounded reverse-Tab steps'
          }

          [void]$shell.SendKeys('{ENTER}')
          Start-Sleep -Seconds 2
          if ((Get-ForegroundTitle) -ne 'Minecraft') { throw 'Minecraft foreground lost after Worlds tab activation' }
          $worldsScreenPath=Join-Path $out 'worlds-screen.png'
          Capture $worldsScreenPath
          if (-not (Test-WorldsScreen $worldsScreenPath)) {
            throw 'Worlds screen fingerprint missing after Worlds tab activation'
          }

          function Test-CreateFocus([string]$imagePath) {
            $bmp=[System.Drawing.Bitmap]::FromFile($imagePath)
            try {
              $center=$bmp.GetPixel(835,333)
              $leftBorder=$bmp.GetPixel(511,330)
              $topBorder=$bmp.GetPixel(835,269)
              $rightBorder=$bmp.GetPixel(1160,330)
              $bottomBorder=$bmp.GetPixel(835,398)

              $centerGreen=($center.G -ge 100 -and $center.G -gt ($center.R + 35) -and $center.G -gt ($center.B + 35))
              $whiteBorder=(
                $leftBorder.R -ge 245 -and $leftBorder.G -ge 245 -and $leftBorder.B -ge 245 -and
                $topBorder.R -ge 245 -and $topBorder.G -ge 245 -and $topBorder.B -ge 245 -and
                $rightBorder.R -ge 245 -and $rightBorder.G -ge 245 -and $rightBorder.B -ge 245 -and
                $bottomBorder.R -ge 245 -and $bottomBorder.G -ge 245 -and $bottomBorder.B -ge 245
              )
              return ($centerGreen -and $whiteBorder)
            } finally { $bmp.Dispose() }
          }

          $focusedPath=Join-Path $out 'create-focused.png'
          $focusFound=$false
          $tabCount=0

          for ($i=0; $i -lt 10; $i++) {
            Capture $focusedPath
            if (Test-CreateFocus $focusedPath) {
              $focusFound=$true
              break
            }
            [void]$shell.SendKeys('{TAB}')
            $tabCount++
            Start-Sleep -Milliseconds 650
          }

          if (-not $focusFound) {
            throw 'Create New World keyboard-focus fingerprint was not found within 10 bounded Tab steps; refusing Enter'
          }

          [void]$shell.SendKeys('{ENTER}')
          Start-Sleep -Seconds 8
          if ((Get-ForegroundTitle) -ne 'Minecraft') { throw 'Minecraft foreground lost after Create New World activation' }

          $afterPath=Join-Path $out 'after-create-enter.png'
          Capture $afterPath

          Write-Host ('BWR_CREATE_SETTINGS_JSON=' + ([ordered]@{
            foreground_verified=$true
            neutral_cursor=$true
            worlds_reverse_tab_count=$reverseTabCount
            worlds_tab_focus_verified=$true
            worlds_screen_verified=$true
            tab_count=$tabCount
            create_focus_verified=$true
            enter_sent=$true
            screenshot_captured=(Test-Path $afterPath)
            existing_world_clicked=$false
            world_opened=$false
          } | ConvertTo-Json -Compress))

      - name: Upload Create Settings probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bedrock-wither-create-settings-probe
          retention-days: 3
          if-no-files-found: warn
          path: |
            bedrock-create-settings-probe/worlds-tab-focused.png
            bedrock-create-settings-probe/worlds-screen.png
            bedrock-create-settings-probe/create-focused.png
            bedrock-create-settings-probe/after-create-enter.png
