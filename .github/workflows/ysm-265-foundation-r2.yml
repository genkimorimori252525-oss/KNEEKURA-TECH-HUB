name: YSM Foundation Map revalidation
# explicit-domain-pass

on:
  push:
    branches: ["jolly/research-ysm-2026-10-05"]
    paths:
      - '.github/workflows/ysm-265-foundation-r2.yml'

permissions:
  contents: read

jobs:
  revalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact official YSM artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p foundation-r2
          URL='https://cdn.modrinth.com/data/86xjpqqS/versions/Zqooxsd2/ysm-2.6.5-forge%2Bmc1.20.1-release.jar'
          curl --fail --location --retry 3 --max-time 180 "$URL" -o "$RUNNER_TEMP/ysm-2.6.5.jar"
          echo '25b5e902b96f4c298690208f8b433cbc31737c23f87590354dbd86f00207bc8f  '"$RUNNER_TEMP/ysm-2.6.5.jar" | sha256sum --check
      - name: Revalidate semantic map against exact JAR
        shell: bash
        run: |
          set -euo pipefail
          python departments/minecraft/mods/yes-steve-model/tools/scan_ysm_265.py \
            --jar "$RUNNER_TEMP/ysm-2.6.5.jar" \
            --map departments/minecraft/mods/yes-steve-model/OBFUSCATION-MAP-2026-10-05.json \
            --out foundation-r2/structure.json \
            2>&1 | tee foundation-r2/structure-summary.txt
          python - <<'PY'
          import json
          d=json.load(open('foundation-r2/structure.json',encoding='utf-8'))
          assert d['artifact']['sha256']=='25b5e902b96f4c298690208f8b433cbc31737c23f87590354dbd86f00207bc8f'
          assert not d['map_contract']['failures'], d['map_contract']['failures']
          print('KNEEKURA_MAP_CONTRACT_R2_PASS', d['map_contract']['status_counts'])
          PY
      - name: Rebuild Foundation Map
        shell: bash
        run: |
          set -euo pipefail
          python departments/minecraft/mods/yes-steve-model/tools/cluster_ysm_265.py \
            --jar "$RUNNER_TEMP/ysm-2.6.5.jar" \
            --map departments/minecraft/mods/yes-steve-model/OBFUSCATION-MAP-2026-10-05.json \
            --out foundation-r2/foundation-map.json \
            2>&1 | tee foundation-r2/foundation-summary.txt
          python - <<'PY'
          import json
          d=json.load(open('foundation-r2/foundation-map.json',encoding='utf-8'))
          assert d['artifact']['classes']==955
          assert len(d['classes'])==955
          assert len({x['class'] for x in d['classes']})==955
          assert d['artifact']['parse_errors']==0
          print('KNEEKURA_FOUNDATION_R2_PASS')
          print(json.dumps({
            'graph':d['graph'],
            'domains':{k:{kk:v[kk] for kk in ('classes','mapped_seed_classes','unresolved_classes','average_domain_score')} for k,v in d['domains'].items()},
            'unknown_top':d['domains'].get('UNKNOWN',{}).get('top_unresolved',[])[:20],
            'cross_domain_edges':d['cross_domain_edges'][:25],
          }, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ysm-foundation-r2-${{ github.sha }}
          path: foundation-r2/
          retention-days: 7
