name: MOD AI Forge integration

on:
  push:
    branches: ["jolly/minecraft-mod-ai-impl-2026-09-28"]
    paths:
      - 'departments/minecraft/mod-ai/forge-observer/**'
      - '.github/workflows/mod-ai-forge.yml'

permissions:
  contents: read

concurrency:
  group: mod-ai-forge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observer-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare exact Forge reference MDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p forge-evidence "$RUNNER_TEMP/kthub-forge-mdk"
          git rev-parse HEAD > forge-evidence/hub-commit.txt
          curl --fail --location --retry 2 --max-time 120 \
            https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.6/forge-1.20.1-47.4.6-mdk.zip \
            -o "$RUNNER_TEMP/kthub-forge-mdk.zip"
          echo "1a1c045f235262ff617e285ea2156571ea93bfbe  $RUNNER_TEMP/kthub-forge-mdk.zip" | sha1sum --check
          sha256sum "$RUNNER_TEMP/kthub-forge-mdk.zip" > forge-evidence/mdk-sha256.txt
          unzip -q "$RUNNER_TEMP/kthub-forge-mdk.zip" -d "$RUNNER_TEMP/kthub-forge-mdk"
          # Only replace the disposable MDK example; never touch a user workspace.
          rm -rf "$RUNNER_TEMP/kthub-forge-mdk/src"
          cp -R departments/minecraft/mod-ai/forge-observer/src "$RUNNER_TEMP/kthub-forge-mdk/src"
          sed -i 's/^mod_id=.*/mod_id=kneekura_observer/' "$RUNNER_TEMP/kthub-forge-mdk/gradle.properties"
          cp "$RUNNER_TEMP/kthub-forge-mdk/build.gradle" forge-evidence/mdk-build.gradle.txt
          cp "$RUNNER_TEMP/kthub-forge-mdk/gradle.properties" forge-evidence/mdk-gradle.properties.txt
          cp "$RUNNER_TEMP/kthub-forge-mdk/gradle/wrapper/gradle-wrapper.properties" forge-evidence/wrapper.properties.txt
          find departments/minecraft/mod-ai/forge-observer/src -type f -print0 | sort -z | xargs -0 sha256sum > forge-evidence/observer-inputs.sha256
          echo 'Reference validation: Minecraft 1.20.1 / Forge 47.4.6 / Java 17. This does not change any user MOD project.' > forge-evidence/scope.txt
      - name: Compile and package the actual Forge bindings
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/kthub-forge-mdk"
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3G compileJava jar 2>&1 | tee "$GITHUB_WORKSPACE/forge-evidence/compile.txt"
          sha256sum build/libs/*.jar > "$GITHUB_WORKSPACE/forge-evidence/observer-jar.sha256"
      - name: Retain bounded integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-observer-${{ github.sha }}
          path: forge-evidence/
          retention-days: 7
