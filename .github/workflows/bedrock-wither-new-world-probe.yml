name: Bedrock Wither New World Probe

on:
  push:
    branches:
      - codex/bedrock-wither-lifecycle-regressions-2026-10-03
    paths:
      - '.github/workflows/bedrock-wither-new-world-probe.yml'
      - '.github/bedrock-wither-new-world-probe-request.txt'

permissions:
  contents: read

concurrency:
  group: bedrock-wither-new-world-probe
  cancel-in-progress: false

jobs:
  new-world-probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    defaults:
      run:
        shell: powershell

    steps:
      - name: Open selected New World entry without touching existing worlds
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'bedrock-new-world-probe'
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          New-Item -ItemType Directory -Path $out | Out-Null

          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class Win32NewWorldBwr {
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetWindowText(IntPtr hWnd, System.Text.StringBuilder text, int count);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hWnd, int command);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr hWnd, IntPtr processId);
            [DllImport("user32.dll")] public static extern bool AttachThreadInput(uint idAttach, uint idAttachTo, bool attach);
            [DllImport("user32.dll")] public static extern bool BringWindowToTop(IntPtr hWnd);
            [DllImport("kernel32.dll")] public static extern uint GetCurrentThreadId();
          }
          '@
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms

          function Capture([string]$path) {
            $screen = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bitmap = New-Object System.Drawing.Bitmap $screen.Width,$screen.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            try {
              $graphics.CopyFromScreen($screen.Left,$screen.Top,0,0,$screen.Size)
              $bitmap.Save($path,[System.Drawing.Imaging.ImageFormat]::Png)
            } finally {
              $graphics.Dispose()
              $bitmap.Dispose()
            }
          }

          function Get-ForegroundTitle {
            $h = [Win32NewWorldBwr]::GetForegroundWindow()
            $sb = New-Object System.Text.StringBuilder 512
            [void][Win32NewWorldBwr]::GetWindowText($h,$sb,$sb.Capacity)
            return $sb.ToString()
          }

          $sessionId = (Get-Process -Id $PID).SessionId
          $windowProcess = Get-Process -ErrorAction SilentlyContinue |
            Where-Object {
              $_.SessionId -eq $sessionId -and
              $_.MainWindowHandle -ne 0 -and
              $_.MainWindowTitle -eq 'Minecraft'
            } |
            Select-Object -First 1
          if ($null -eq $windowProcess) {
            throw 'Expected existing Minecraft Play-screen process is absent; refusing to guess navigation state'
          }

          $foregroundHandleBefore = [Win32NewWorldBwr]::GetForegroundWindow()
          $currentThread = [Win32NewWorldBwr]::GetCurrentThreadId()
          $foregroundThread = [Win32NewWorldBwr]::GetWindowThreadProcessId($foregroundHandleBefore,[IntPtr]::Zero)
          $targetThread = [Win32NewWorldBwr]::GetWindowThreadProcessId($windowProcess.MainWindowHandle,[IntPtr]::Zero)
          if ($foregroundThread -ne 0) { [Win32NewWorldBwr]::AttachThreadInput($currentThread,$foregroundThread,$true) | Out-Null }
          if ($targetThread -ne 0 -and $targetThread -ne $currentThread) { [Win32NewWorldBwr]::AttachThreadInput($currentThread,$targetThread,$true) | Out-Null }
          try {
            [Win32NewWorldBwr]::ShowWindow($windowProcess.MainWindowHandle,9) | Out-Null
            [Win32NewWorldBwr]::BringWindowToTop($windowProcess.MainWindowHandle) | Out-Null
            [Win32NewWorldBwr]::SetForegroundWindow($windowProcess.MainWindowHandle) | Out-Null
          } finally {
            if ($targetThread -ne 0 -and $targetThread -ne $currentThread) { [Win32NewWorldBwr]::AttachThreadInput($currentThread,$targetThread,$false) | Out-Null }
            if ($foregroundThread -ne 0) { [Win32NewWorldBwr]::AttachThreadInput($currentThread,$foregroundThread,$false) | Out-Null }
          }

          Start-Sleep -Seconds 1
          if ((Get-ForegroundTitle) -ne 'Minecraft') { throw 'Minecraft foreground verification failed' }

          $before = Join-Path $out 'play-before-create-enter.png'
          Capture $before

          # Verify the large Create New World button is the selected green element.
          # Existing world cards start below this control and are never clicked.
          $bmp = [System.Drawing.Bitmap]::FromFile($before)
          try {
            $create = $bmp.GetPixel(835,333)
            $createSelected = ($create.G -ge 90 -and $create.G -gt ($create.R + 35) -and $create.G -gt ($create.B + 35))
          } finally {
            $bmp.Dispose()
          }
          if (-not $createSelected) { throw 'Create New World selection fingerprint missing; refusing Enter' }

          $shell = New-Object -ComObject WScript.Shell
          [void]$shell.SendKeys('{ENTER}')
          Start-Sleep -Seconds 8
          if ((Get-ForegroundTitle) -ne 'Minecraft') { throw 'Minecraft foreground lost after Create New World Enter' }

          Capture (Join-Path $out 'new-world-screen.png')

          Write-Host ('BWR_NEW_WORLD_PROBE_JSON=' + ([ordered]@{
            foreground_verified = $true
            play_screen_verified = $true
            create_new_selected = $true
            enter_key_sent = $true
            existing_world_clicked = $false
            world_opened = $false
          } | ConvertTo-Json -Compress))

      - name: Upload New World screen probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bedrock-wither-new-world-probe
          retention-days: 3
          if-no-files-found: warn
          path: |
            bedrock-new-world-probe/play-before-create-enter.png
            bedrock-new-world-probe/new-world-screen.png
