name: test

on:
  push:
    branches: [main, "jolly/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kneekura
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kneekura"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      KTHUB_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kneekura
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install declared dependencies
        run: python -m pip install -e ".[dev]"
      - name: Record tested environment
        run: |
          mkdir -p test-evidence
          git rev-parse HEAD | tee test-evidence/commit.txt
          python --version
          java -version
          python -m pip freeze > test-evidence/dependencies.txt
      - name: Run complete repository suite
        run: |
          set -o pipefail
          python -m pytest -q --junitxml=test-evidence/junit.xml 2>&1 | tee test-evidence/pytest.txt
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hub-tests-${{ github.sha }}
          path: test-evidence/
          retention-days: 7
