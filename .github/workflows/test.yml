name: test

on:
  push:
    branches: [main, "jolly/**"]
  pull_request:

permissions:
  contents: read

jobs:
  # self-hosted の Windows ランナー（JollyRunnerHub / tech-hub）で回す。
  # Linux 専用の services: は使えない（Container operations are only supported on
  # Linux runners）ため、postgres は step から Docker で起動する。実測 2026-09-23。
  pytest:
    runs-on: [self-hosted, Windows, X64, tech-hub]
    timeout-minutes: 30
    env:
      KTHUB_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kneekura
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Start postgres in a linux container
        run: |
          docker rm -f kthub-pg 2>$null | Out-Null
          docker run -d --name kthub-pg `
            -e POSTGRES_DB=kneekura `
            -e POSTGRES_USER=postgres `
            -e POSTGRES_PASSWORD=postgres `
            -p 5432:5432 postgres:16 | Out-Null
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            docker exec kthub-pg pg_isready -U postgres -d kneekura *> $null
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $ok) { throw 'postgres container did not become ready' }

      # Windows の git は既定で CRLF に変換する。バイト数や SHA256 を固定値で
      # 検証しているフィクスチャが落ちるため、作業ツリーを LF に正規化する。
      - name: Normalize line endings to LF
        run: |
          git config core.autocrlf false
          git config core.eol lf
          git rm --cached -r -q . | Out-Null
          git reset --hard -q

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      # pytest.exe は PATH に入らない（Windows の pip は Scripts を PATH に足さない）
      - name: Test
        run: python -m pytest -q

      - name: Cleanup postgres
        if: always()
        run: docker rm -f kthub-pg