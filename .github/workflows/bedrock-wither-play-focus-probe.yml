name: Bedrock Wither Play Focus Probe

on:
  push:
    branches:
      - codex/bedrock-wither-lifecycle-regressions-2026-10-03
    paths:
      - '.github/workflows/bedrock-wither-play-focus-probe.yml'
      - '.github/bedrock-wither-play-focus-probe-request.txt'

permissions:
  contents: read

concurrency:
  group: bedrock-wither-play-focus-probe
  cancel-in-progress: false

jobs:
  focus-probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    defaults:
      run:
        shell: powershell

    steps:
      - name: Inspect Play-screen keyboard focus order
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'bedrock-play-focus-probe'
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          New-Item -ItemType Directory -Path $out | Out-Null

          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class Win32FocusBwr {
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int X, int Y);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetWindowText(IntPtr hWnd, System.Text.StringBuilder text, int count);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hWnd, int command);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr hWnd, IntPtr processId);
            [DllImport("user32.dll")] public static extern bool AttachThreadInput(uint idAttach, uint idAttachTo, bool attach);
            [DllImport("user32.dll")] public static extern bool BringWindowToTop(IntPtr hWnd);
            [DllImport("kernel32.dll")] public static extern uint GetCurrentThreadId();
          }
          '@
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms

          function Capture([string]$path) {
            $screen=[System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp=New-Object System.Drawing.Bitmap $screen.Width,$screen.Height
            $g=[System.Drawing.Graphics]::FromImage($bmp)
            try {
              $g.CopyFromScreen($screen.Left,$screen.Top,0,0,$screen.Size)
              $bmp.Save($path,[System.Drawing.Imaging.ImageFormat]::Png)
            } finally { $g.Dispose(); $bmp.Dispose() }
          }

          function Get-ForegroundTitle {
            $h=[Win32FocusBwr]::GetForegroundWindow()
            $sb=New-Object System.Text.StringBuilder 512
            [void][Win32FocusBwr]::GetWindowText($h,$sb,$sb.Capacity)
            return $sb.ToString()
          }

          $sessionId=(Get-Process -Id $PID).SessionId
          $windowProcess=Get-Process -ErrorAction SilentlyContinue |
            Where-Object { $_.SessionId -eq $sessionId -and $_.MainWindowHandle -ne 0 -and $_.MainWindowTitle -eq 'Minecraft' } |
            Select-Object -First 1
          if ($null -eq $windowProcess) { throw 'Minecraft Play-screen process absent' }

          $fg=[Win32FocusBwr]::GetForegroundWindow()
          $cur=[Win32FocusBwr]::GetCurrentThreadId()
          $fgThread=[Win32FocusBwr]::GetWindowThreadProcessId($fg,[IntPtr]::Zero)
          $targetThread=[Win32FocusBwr]::GetWindowThreadProcessId($windowProcess.MainWindowHandle,[IntPtr]::Zero)
          if ($fgThread -ne 0) { [Win32FocusBwr]::AttachThreadInput($cur,$fgThread,$true) | Out-Null }
          if ($targetThread -ne 0 -and $targetThread -ne $cur) { [Win32FocusBwr]::AttachThreadInput($cur,$targetThread,$true) | Out-Null }
          try {
            [Win32FocusBwr]::ShowWindow($windowProcess.MainWindowHandle,9) | Out-Null
            [Win32FocusBwr]::BringWindowToTop($windowProcess.MainWindowHandle) | Out-Null
            [Win32FocusBwr]::SetForegroundWindow($windowProcess.MainWindowHandle) | Out-Null
          } finally {
            if ($targetThread -ne 0 -and $targetThread -ne $cur) { [Win32FocusBwr]::AttachThreadInput($cur,$targetThread,$false) | Out-Null }
            if ($fgThread -ne 0) { [Win32FocusBwr]::AttachThreadInput($cur,$fgThread,$false) | Out-Null }
          }

          Start-Sleep -Seconds 1
          if ((Get-ForegroundTitle) -ne 'Minecraft') { throw 'Foreground verification failed' }

          [Win32FocusBwr]::SetCursorPos(10,10) | Out-Null
          Start-Sleep -Seconds 1
          Capture (Join-Path $out 'tab0.png')

          $shell=New-Object -ComObject WScript.Shell
          for ($i=1; $i -le 5; $i++) {
            [void]$shell.SendKeys('{TAB}')
            Start-Sleep -Milliseconds 700
            Capture (Join-Path $out ("tab{0}.png" -f $i))
          }

          Write-Host ('BWR_PLAY_FOCUS_JSON=' + ([ordered]@{
            foreground_verified=$true
            cursor_moved_to_neutral_corner=$true
            tab_steps=5
            enter_sent=$false
            existing_world_clicked=$false
            world_opened=$false
          } | ConvertTo-Json -Compress))

      - name: Upload Play focus sequence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bedrock-wither-play-focus-probe
          retention-days: 3
          if-no-files-found: warn
          path: bedrock-play-focus-probe/*.png
