name: Twilight Forest ANCHOR JAR evidence

on:
  push:
    branches:
      - jolly/minecraft-tech-department-2026-09-22
    paths:
      - '.github/workflows/twilight-anchor-jar-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-anchor-jar:
    runs-on: [self-hosted, Windows, X64, kneekura]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Locate Python
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python --version

      - name: Download and verify Twilight Forest 4.3.2508
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python departments/minecraft/mods/twilight-forest/tools/verify_anchor_jar.py

      - name: Remove downloaded third-party JAR
        if: always()
        shell: powershell
        run: |
          $jar = 'departments/minecraft/local-artifacts/twilight-forest/twilightforest-1.20.1-4.3.2508-universal.jar'
          if (Test-Path $jar) {
            Remove-Item -Force $jar
          }

      - name: Upload compact evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twilight-anchor-4.3.2508-evidence
          path: departments/minecraft/local-artifacts/twilight-forest/anchor-4.3.2508-evidence.json
          if-no-files-found: warn
          retention-days: 7
