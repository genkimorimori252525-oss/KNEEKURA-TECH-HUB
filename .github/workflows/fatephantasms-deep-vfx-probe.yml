name: FatePhantasms deep VFX probe

on:
  push:
    branches:
      - jolly/research-fatephantasms-vfx-2026-10-06
    paths:
      - .github/workflows/fatephantasms-deep-vfx-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download r284
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fatephantasms out
          curl -L --fail --retry 3 -o /tmp/fatephantasms/r284.jar https://github.com/Terry0333/FatePhantasms/releases/download/8/FatePhantasms-1.0.0-r284.jar
          echo "68158d03ae033577def23d51c4e238c8f9aa082243c8da16fbe0e4f9a3fcc88c  /tmp/fatephantasms/r284.jar" | sha256sum -c -

      - name: Disassemble selected systems
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/classes.txt <<'EOF'
          cn.blockforge.generated.mod47ef859b.EaAbility
          cn.blockforge.generated.mod47ef859b.EaAbility$Cast
          cn.blockforge.generated.mod47ef859b.EaAbility$CastTiming
          cn.blockforge.generated.mod47ef859b.EaSummoningEntity
          cn.blockforge.generated.mod47ef859b.ModConfig
          cn.blockforge.generated.mod47ef859b.ModNetwork
          cn.blockforge.generated.mod47ef859b.ModNetwork$CastStartMessage
          cn.blockforge.generated.mod47ef859b.ModNetwork$ScreenShakeMessage
          cn.blockforge.generated.mod47ef859b.ModNetwork$SummonFinaleMessage
          cn.blockforge.generated.mod47ef859b.ModNetwork$GateActionMessage
          cn.blockforge.generated.mod47ef859b.ModNetwork$GateStateMessage
          cn.blockforge.generated.mod47ef859b.ModNetwork$EnkiduActionMessage
          cn.blockforge.generated.mod47ef859b.SoundRegistry
          cn.blockforge.generated.mod47ef859b.GateOfBabylonAbility
          cn.blockforge.generated.mod47ef859b.GateOfBabylonAbility$Session
          cn.blockforge.generated.mod47ef859b.GateOfBabylonData
          cn.blockforge.generated.mod47ef859b.GateOfBabylonData$Portal
          cn.blockforge.generated.mod47ef859b.GateOfBabylonData$Shot
          cn.blockforge.generated.mod47ef859b.GateOfBabylonData$Volley
          cn.blockforge.generated.mod47ef859b.GateOfBabylonProjectile
          cn.blockforge.generated.mod47ef859b.GateOfBabylonSounds
          cn.blockforge.generated.mod47ef859b.EnkiduAbility
          cn.blockforge.generated.mod47ef859b.EnkiduAbility$Session
          cn.blockforge.generated.mod47ef859b.EnkiduData
          cn.blockforge.generated.mod47ef859b.EnkiduData$Anchor
          cn.blockforge.generated.mod47ef859b.EnkiduChainEntity
          cn.blockforge.generated.mod47ef859b.EnkiduSounds
          cn.blockforge.generated.mod47ef859b.client.EaSummoningRenderer
          cn.blockforge.generated.mod47ef859b.client.EaSwordClientEvents
          cn.blockforge.generated.mod47ef859b.client.EaSwordSpinState
          cn.blockforge.generated.mod47ef859b.client.EaSwordSpinState$CastState
          cn.blockforge.generated.mod47ef859b.client.EaSwordSpinState$ChargeStage
          cn.blockforge.generated.mod47ef859b.client.GateOfBabylonClientState
          cn.blockforge.generated.mod47ef859b.client.GateOfBabylonClientState$Session
          cn.blockforge.generated.mod47ef859b.client.GateOfBabylonRenderer
          cn.blockforge.generated.mod47ef859b.client.GateOfBabylonProjectileRenderer
          cn.blockforge.generated.mod47ef859b.client.GateWeaponRenderer
          cn.blockforge.generated.mod47ef859b.client.GateOfBabylonHud
          cn.blockforge.generated.mod47ef859b.client.EnkiduChainRenderer
          EOF
          sed -i 's/^          //' /tmp/classes.txt
          : > out/r284-selected-javap.txt
          while IFS= read -r cls; do
            [ -z "$cls" ] && continue
            {
              echo
              echo "===== $cls ====="
              javap -classpath /tmp/fatephantasms/r284.jar -p -c -s "$cls" 2>&1 || true
            } >> out/r284-selected-javap.txt
          done < /tmp/classes.txt

      - name: Build derived resource and symbol summary
        shell: python
        run: |
          import hashlib, json, re, zipfile, pathlib

          jar = pathlib.Path("/tmp/fatephantasms/r284.jar")
          out = pathlib.Path("out")
          result = {}
          with zipfile.ZipFile(jar) as z:
              def read_json(path):
                  return json.loads(z.read(path).decode("utf-8"))
              sounds = read_json("assets/mod_47ef859b/sounds.json")
              result["sound_events"] = {
                  k: {
                      "subtitle": v.get("subtitle"),
                      "sound_count": len(v.get("sounds", [])),
                      "sound_names": [(x if isinstance(x,str) else x.get("name")) for x in v.get("sounds",[])],
                  } for k,v in sounds.items()
              }
              gate = read_json("assets/mod_47ef859b/gate/gate_weapons.json")
              def shape(x, depth=0):
                  if depth > 3: return type(x).__name__
                  if isinstance(x,dict):
                      return {k: shape(v, depth+1) for k,v in list(x.items())[:20]}
                  if isinstance(x,list):
                      return {"list_len":len(x), "item_shape":shape(x[0],depth+1) if x else None}
                  return type(x).__name__
              result["gate_weapons"] = {
                  "top_level_type": type(gate).__name__,
                  "top_level_keys": sorted(gate.keys()) if isinstance(gate,dict) else None,
                  "entry_count": len(gate) if hasattr(gate,"__len__") else None,
                  "schema_shape": shape(gate),
              }
              for path in [
                  "assets/mod_47ef859b/gate/gate_weapons.json",
                  "assets/mod_47ef859b/sounds.json",
                  "assets/mod_47ef859b/shaders/core/ea_glow.json",
                  "assets/mod_47ef859b/particles/ea_beam_dust.json",
              ]:
                  result.setdefault("resource_hashes",{})[path]=hashlib.sha256(z.read(path)).hexdigest()
              for lang in ("en_us","zh_cn","zh_tw"):
                  obj=read_json(f"assets/mod_47ef859b/lang/{lang}.json")
                  result.setdefault("language_keys",{})[lang]=sorted(obj.keys())
          (out/"r284-derived-resource-summary.json").write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")

          text_data=(out/"r284-selected-javap.txt").read_text(encoding="utf-8",errors="ignore")
          blocks=re.split(r"(?m)^===== (.*?) =====\n", text_data)
          classes={}
          for i in range(1,len(blocks),2):
              name=blocks[i]; body=blocks[i+1]
              methods=[]
              for line in body.splitlines():
                  if re.match(r"^  (public|private|protected|static)", line) and "(" in line and line.rstrip().endswith(";"):
                      methods.append(line.strip())
              strings=sorted(set(re.findall(r"// String ([^\r\n]+)",body)))
              classes[name]={"methods":methods,"strings":strings}
          (out/"r284-symbol-summary.json").write_text(json.dumps(classes,ensure_ascii=False,indent=2),encoding="utf-8")

      - name: Print selected signatures
        shell: bash
        run: |
          grep -E '^===== |^  (public|private|protected|static)' out/r284-selected-javap.txt | head -n 1500

      - name: Upload derived evidence
        uses: actions/upload-artifact@v4
        with:
          name: fatephantasms-deep-vfx-probe
          path: out/
          retention-days: 1
