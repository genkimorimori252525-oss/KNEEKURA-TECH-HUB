name: Bedrock Wither Settings Map Probe

on:
  push:
    branches:
      - codex/bedrock-wither-lifecycle-regressions-2026-10-03
    paths:
      - '.github/workflows/bedrock-wither-settings-map-probe.yml'
      - '.github/bedrock-wither-settings-map-probe-request.txt'

permissions:
  contents: read

concurrency:
  group: bedrock-wither-settings-map-probe
  cancel-in-progress: false

jobs:
  settings-map:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    defaults:
      run:
        shell: powershell

    steps:
      - name: Capture read-only creation-settings scroll map
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:GITHUB_WORKSPACE 'bedrock-settings-map-probe'
          if(Test-Path $out){Remove-Item $out -Recurse -Force}
          New-Item -ItemType Directory -Path $out | Out-Null

          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class Win32SettingsMapBwr {
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int X,int Y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint flags,uint dx,uint dy,uint data,UIntPtr extra);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            [DllImport("user32.dll",CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr hWnd,System.Text.StringBuilder text,int count);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hWnd,int command);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr hWnd,IntPtr processId);
            [DllImport("user32.dll")] public static extern bool AttachThreadInput(uint a,uint b,bool attach);
            [DllImport("user32.dll")] public static extern bool BringWindowToTop(IntPtr hWnd);
            [DllImport("kernel32.dll")] public static extern uint GetCurrentThreadId();
            public const uint WHEEL=0x0800;
            public static void Wheel(int delta){ mouse_event(WHEEL,0,0,unchecked((uint)delta),UIntPtr.Zero); }
          }
          '@
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms

          function Capture([string]$path){
            $s=[System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp=New-Object System.Drawing.Bitmap $s.Width,$s.Height
            $g=[System.Drawing.Graphics]::FromImage($bmp)
            try{
              $g.CopyFromScreen($s.Left,$s.Top,0,0,$s.Size)
              $bmp.Save($path,[System.Drawing.Imaging.ImageFormat]::Png)
            }finally{$g.Dispose();$bmp.Dispose()}
          }
          function Get-ForegroundTitle{
            $h=[Win32SettingsMapBwr]::GetForegroundWindow()
            $sb=New-Object System.Text.StringBuilder 512
            [void][Win32SettingsMapBwr]::GetWindowText($h,$sb,$sb.Capacity)
            return $sb.ToString()
          }

          $sid=(Get-Process -Id $PID).SessionId
          $p=Get-Process -ErrorAction SilentlyContinue |
            Where-Object{$_.SessionId -eq $sid -and $_.MainWindowHandle -ne 0 -and $_.MainWindowTitle -eq 'Minecraft'} |
            Select-Object -First 1
          if($null -eq $p){throw 'Minecraft creation-settings window absent'}

          $fg=[Win32SettingsMapBwr]::GetForegroundWindow()
          $cur=[Win32SettingsMapBwr]::GetCurrentThreadId()
          $fgT=[Win32SettingsMapBwr]::GetWindowThreadProcessId($fg,[IntPtr]::Zero)
          $targetT=[Win32SettingsMapBwr]::GetWindowThreadProcessId($p.MainWindowHandle,[IntPtr]::Zero)
          if($fgT -ne 0){[Win32SettingsMapBwr]::AttachThreadInput($cur,$fgT,$true)|Out-Null}
          if($targetT -ne 0 -and $targetT -ne $cur){[Win32SettingsMapBwr]::AttachThreadInput($cur,$targetT,$true)|Out-Null}
          try{
            [Win32SettingsMapBwr]::ShowWindow($p.MainWindowHandle,9)|Out-Null
            [Win32SettingsMapBwr]::BringWindowToTop($p.MainWindowHandle)|Out-Null
            [Win32SettingsMapBwr]::SetForegroundWindow($p.MainWindowHandle)|Out-Null
          }finally{
            if($targetT -ne 0 -and $targetT -ne $cur){[Win32SettingsMapBwr]::AttachThreadInput($cur,$targetT,$false)|Out-Null}
            if($fgT -ne 0){[Win32SettingsMapBwr]::AttachThreadInput($cur,$fgT,$false)|Out-Null}
          }

          Start-Sleep -Seconds 1
          if((Get-ForegroundTitle) -ne 'Minecraft'){throw 'Foreground verification failed'}

          [Win32SettingsMapBwr]::SetCursorPos(1180,720)|Out-Null
          Start-Sleep -Milliseconds 500
          Capture (Join-Path $out 'scroll0.png')

          for($i=1;$i -le 7;$i++){
            [Win32SettingsMapBwr]::Wheel(-720)
            Start-Sleep -Milliseconds 800
            Capture (Join-Path $out ("scroll{0}.png" -f $i))
          }

          Write-Host ('BWR_SETTINGS_MAP_JSON=' + ([ordered]@{
            foreground_verified=$true
            screenshots=8
            wheel_only=$true
            settings_changed=$false
            world_created=$false
          } | ConvertTo-Json -Compress))

      - name: Upload settings map
        uses: actions/upload-artifact@v4
        with:
          name: bedrock-wither-settings-map-probe
          retention-days: 3
          if-no-files-found: error
          path: bedrock-settings-map-probe/*.png
